<style>
/* ══════════════════════════════════════════════════════════════════════
   💼 CAPEX — proyectos de inversión (29 oct 2026)
   Solo Administrador y Encargado de mantenimiento (también en firestore.rules).
   Datos:  /capex/{id}            un proyecto (ver "MODELO" en el script)
           /config/capex          tasa de cambio por defecto, contingencia, ITBIS, empresa (sin montos)
           /config/capexFolio     contador CAPEX-AAAA-001 (solo se le suma 1)
           /config/capexLogo      logo de la ficha (opcional; si no, el de Incentivos para el Admin)
           /capex_config/general  presupuesto anual por año y por nave (SOLO Administrador)
   Lecturas: 1 consulta por año fiscal (where anioFiscal ==, un solo campo: sin
   índices compuestos) + 1–3 documentos de configuración. Catálogo de equipos
   con la caché de 12 h de siempre. Sin listeners.
   ══════════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; overflow-x: hidden; }
body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); font-size: 14.5px; line-height: 1.45; min-height: 100vh; }
button, input, select, textarea { font-family: inherit; }
#header { background: var(--color-header-bg); color: var(--color-header-text); border-bottom: 2px solid var(--color-accent); padding: 12px 16px; }
.hrow { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
#header h1 { font-size: 18px; font-weight: 800; margin: 0; letter-spacing: .01em; }
#header small { display: block; font-size: 11.5px; color: var(--color-header-sub); font-weight: 700; margin-top: 2px; }
.hctl { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.28); border-radius: 9px; overflow: hidden; }
.seg button { background: transparent; color: var(--color-header-text); border: 0; min-height: 34px; padding: 4px 11px; font-size: 12.5px; font-weight: 800; cursor: pointer; }
.seg button + button { border-left: 1px solid rgba(255,255,255,.2); }
.seg button[aria-pressed="true"] { background: var(--color-accent); color: var(--color-on-accent); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 12px 16px 70px; min-width: 0; }
.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; min-width: 0; box-shadow: var(--shadow); }
.ct { font-size: 15px; font-weight: 800; margin: 0 0 2px; overflow-wrap: anywhere; }
.cs { font-size: 12px; color: var(--color-muted); margin-bottom: 10px; overflow-wrap: anywhere; }
.chead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.nota { font-size: 12px; color: var(--color-muted); line-height: 1.5; overflow-wrap: anywhere; }
.formula { background: var(--color-surface-2); border-radius: 10px; padding: 9px 11px; font-size: 12px; color: var(--color-text-2); line-height: 1.6; margin-top: 10px; overflow-wrap: anywhere; }
.empty { text-align: center; color: var(--color-muted); padding: 30px 12px; }
.ut { overflow-wrap: anywhere; }
/* barra de herramientas del portafolio */
.tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
.tools .full { grid-column: 1 / -1; }
.tools select, .tools input, .fbFiltros select { min-height: 42px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 9px 14px; border-radius: 10px; border: 0; background: var(--color-primary); color: var(--color-on-primary); font-weight: 800; font-size: 14px; cursor: pointer; text-decoration: none; line-height: 1.2; text-align: center; }
.btn.sec { background: var(--color-surface-2); color: var(--color-text); border: 1px solid var(--color-border); }
.btn.ok { background: #15803d; color: #fff; }
.btn.mal { background: var(--color-danger); color: #fff; }
.btn.warn { background: var(--color-warn); color: #fff; }
.btn.sm { min-height: 38px; padding: 6px 11px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.lnk { background: none; border: 0; color: var(--color-primary-text); font-weight: 800; font-size: 12.5px; cursor: pointer; padding: 4px 0; min-height: 32px; }
label.f { display: block; font-size: 11.5px; font-weight: 800; color: var(--color-text-2); margin: 10px 0 4px; letter-spacing: .02em; }
input, select, textarea { width: 100%; min-width: 0; max-width: 100%; min-height: 42px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--color-border); background: var(--color-input-bg); color: var(--color-text); font-size: 15px; }
input[type=checkbox] { width: 22px; height: 22px; min-height: 0; accent-color: var(--color-primary); flex: none; }
textarea { min-height: 76px; resize: vertical; }
input:focus, select:focus, textarea:focus, .btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 1px; }
input:disabled, select:disabled, textarea:disabled { opacity: .65; }
.g2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 10px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 10px; }
.g4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 10px; }
.span2 { grid-column: span 2; } .spanAll { grid-column: 1 / -1; }
/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 11px 12px; min-width: 0; box-shadow: var(--shadow); }
.kpi > span { display: block; font-size: 11px; font-weight: 800; color: var(--color-muted); text-transform: uppercase; letter-spacing: .05em; }
.kpi b { display: block; font-size: clamp(13.5px, 3.6vw, 20px); font-weight: 800; margin-top: 3px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.2; }
.kpi small { display: block; font-size: 12px; color: var(--color-text-2); margin-top: 2px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.kpi.acc { border-left: 4px solid var(--color-accent); }
.meter { height: 12px; border-radius: 7px; background: var(--color-surface-3); overflow: hidden; position: relative; margin: 8px 0 4px; }
.meter i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 7px; }
.meter i.a { background: #3987e5; } .meter i.r { background: #199e70; } .meter i.over { background: var(--color-danger); }
.leg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--color-text-2); }
.leg span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
/* insignias */
.bdg { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 11.5px; font-weight: 800; white-space: nowrap; border: 1px solid transparent; line-height: 1.7; vertical-align: middle; }
.st-borrador, .st-cancelado { background: var(--color-surface-2); color: var(--color-muted); border-color: var(--color-border-strong); }
.st-enviado { background: var(--color-info-soft); color: var(--color-info-text); border-color: var(--color-info); }
.st-en_espera { background: var(--color-warn-soft); color: var(--color-warn-text); border-color: var(--color-warn); }
.st-aprobado { background: var(--color-success-soft); color: var(--color-success-text); border-color: var(--color-success); }
.st-rechazado { background: var(--color-danger-soft); color: var(--color-danger-text); border-color: var(--color-danger); }
.st-en_ejecucion { background: var(--color-primary-soft); color: var(--color-primary-text); border-color: var(--color-primary); }
.st-cerrado { background: var(--color-purple-soft); color: var(--color-purple-text); border-color: var(--color-purple); }
.cr-A { background: var(--color-danger); color: #fff; } .cr-B { background: var(--color-warn-soft); color: var(--color-warn-text); border-color: var(--color-warn); }
.cr-C { background: var(--color-surface-2); color: var(--color-text-2); border-color: var(--color-border-strong); } .cr-N { color: var(--color-muted); border: 1px dashed var(--color-border-strong); }
.pr-alta { color: var(--color-danger-text); border-color: var(--color-danger); } .pr-media { color: var(--color-warn-text); border-color: var(--color-warn); } .pr-baja { color: var(--color-muted); border-color: var(--color-border-strong); }
.sem-ok { color: var(--color-success-text); } .sem-warn { color: var(--color-warn-text); } .sem-bad { color: var(--color-danger-text); } .sem-na { color: var(--color-muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { min-height: 36px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-2); font-weight: 700; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip b { font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--color-primary); background: var(--color-primary-soft); color: var(--color-primary-text); }
/* tablas: se desplazan dentro de su caja, nunca la página */
.tw { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--color-muted); font-weight: 800; font-size: 11.5px; padding: 7px 6px; border-bottom: 1px solid var(--color-border-strong); white-space: nowrap; }
td { padding: 7px 6px; border-bottom: 1px solid var(--color-border); vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.tot td { font-weight: 800; border-top: 2px solid var(--color-border-strong); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--color-surface-2); }
.tw table { min-width: 560px; } .tw table.sm { min-width: 0; }
.rk td.cod, .rk td.nav, .rk td.bd { white-space: nowrap; } .rk td.tit { min-width: 190px; }
.nstk { display: none; }
td.vacio { color: var(--color-muted); } td.nw { white-space: nowrap; }
/* En el celular las tablas del proyecto se apilan: una tarjeta por fila con "etiqueta: valor" */
@media (max-width: 639px) {
  .tw table.stk { min-width: 0; }
  table.stk thead { display: none; }
  table.stk, table.stk tbody, table.stk tr { display: block; width: 100%; }
  table.stk tr { padding: 8px 0; border-bottom: 1px solid var(--color-border); }
  table.stk td { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border: 0; padding: 2px 0; text-align: right; white-space: normal; overflow-wrap: anywhere; }
  table.stk td::before { content: attr(data-l); flex: 0 0 auto; max-width: 48%; text-align: left; color: var(--color-muted); font-size: 12px; font-weight: 700; }
  table.stk td.lead { display: block; text-align: left; font-weight: 800; font-size: 14px; padding-bottom: 4px; }
  table.stk td.lead::before, table.stk td:not([data-l])::before { content: none; }
  table.stk td.hs, table.stk td.vacio { display: none; }
  table.stk .nstk { display: inline; }
  table.stk tr.tot { border-top: 2px solid var(--color-border-strong); border-bottom: 0; }
  table.stk tr.tot td { font-weight: 800; }
  .dtot { text-align: left !important; }
  table.tt { font-size: 12px; } table.tt td, table.tt th { padding: 6px 3px; }
  .card .fin .kpi b { font-size: 14px; }
  .tools .tipo { grid-column: 1 / -1; }
}
/* tarjetas de proyecto */
.plist { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.pcard { display: block; text-decoration: none; color: inherit; background: var(--color-surface); border: 1px solid var(--color-border); border-left: 4px solid var(--color-border-strong); border-radius: var(--radius); padding: 12px; min-width: 0; box-shadow: var(--shadow); }
.pcard:hover { border-color: var(--color-primary); }
.pcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.pcard .code { font-family: var(--font-mono); font-size: 12px; color: var(--color-muted); }
.pcard h3 { font-size: 15.5px; margin: 5px 0 3px; overflow-wrap: anywhere; }
.pcard .meta { font-size: 12px; color: var(--color-muted); overflow-wrap: anywhere; }
.pcard .nums { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.pcard .nums b { font-size: 14px; }
.chart { position: relative; height: 260px; width: 100%; }
.chart.h-auto { height: auto; }
/* detalle */
.dhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.dhead h2 { font-size: 20px; margin: 4px 0; overflow-wrap: anywhere; }
.dmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.facts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 16px; font-size: 13px; margin-top: 8px; }
.facts div { min-width: 0; overflow-wrap: anywhere; } .facts .fl { color: var(--color-muted); font-weight: 700; margin-right: 4px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.alert { border-radius: 10px; padding: 10px 12px; font-size: 13.5px; font-weight: 700; margin-bottom: 12px; border: 1px solid; overflow-wrap: anywhere; }
.alert.warn { background: var(--color-warn-soft); border-color: var(--color-warn); color: var(--color-warn-text); }
.alert.bad { background: var(--color-danger-soft); border-color: var(--color-danger); color: var(--color-danger-text); }
.alert.info { background: var(--color-info-soft); border-color: var(--color-info); color: var(--color-info-text); }
.fin { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.fin .kpi b { font-size: 16px; }
.fin.f2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fin .kpi { box-shadow: none; background: var(--color-surface-2); }
.dual { font-variant-numeric: tabular-nums; }
.dual small { display: block; color: var(--color-muted); font-size: 11.5px; font-weight: 600; }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { border-left: 3px solid var(--color-border-strong); padding: 4px 0 8px 12px; position: relative; font-size: 13px; overflow-wrap: anywhere; }
.hist li::before { content: ''; position: absolute; left: -7px; top: 8px; width: 11px; height: 11px; border-radius: 50%; background: var(--color-surface); border: 2px solid var(--color-primary); }
.hist small { display: block; color: var(--color-muted); }
/* Gantt (HTML: se ve igual en pantalla, en la ficha impresa y sin conexión) */
.gantt { font-size: 12px; }
.gantt .gr { display: grid; grid-template-columns: minmax(92px, 34%) minmax(0, 1fr); gap: 8px; align-items: center; min-height: 30px; border-bottom: 1px dashed var(--color-border); }
.gantt .gl { overflow-wrap: anywhere; padding: 3px 0; line-height: 1.25; }
.gantt .gl small { display: block; color: var(--color-muted); font-size: 11px; }
.gantt .gt { position: relative; height: 26px; }
.gantt .gb { position: absolute; top: 5px; height: 14px; border-radius: 4px; background: #3987e5; min-width: 3px; }
.gantt .gb.mat { background: repeating-linear-gradient(45deg, #c98500, #c98500 4px, #e0a83a 4px, #e0a83a 8px); }
.gantt .gb.real { top: 18px; height: 6px; background: #199e70; }
.gantt .gb.late { background: #d95926; }
.gantt .gb .pv { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0,0,0,.28); border-radius: 4px; }
.gantt .today { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--color-danger); z-index: 2; }
.gantt .gx { display: grid; grid-template-columns: minmax(92px, 34%) minmax(0, 1fr); gap: 8px; }
.gantt .ticks { position: relative; height: 20px; color: var(--color-muted); font-size: 10.5px; }
.gantt .ticks span { position: absolute; top: 3px; transform: translateX(-50%); white-space: nowrap; }
/* editor */
.ed { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; }
.rowc { border: 1px solid var(--color-border); background: var(--color-surface-2); border-radius: 10px; padding: 4px 10px 10px; margin-top: 8px; min-width: 0; }
.rowc .rh { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 6px; font-weight: 800; font-size: 13px; }
.rowc .stock { font-size: 12px; font-weight: 800; }
.eqchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.eqchips > span { display: inline-flex; align-items: center; gap: 6px; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 13px; }
.eqchips button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--color-surface-3); color: var(--color-text); cursor: pointer; font-weight: 800; }
.ck { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 700; font-size: 14px; }
.errbox { background: var(--color-danger-soft); border: 1px solid var(--color-danger); color: var(--color-danger-text); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-top: 10px; }
.errbox:empty { display: none; }
.errbox ul { margin: 4px 0 0 18px; padding: 0; }
.sug { background: var(--color-accent-soft); border: 1px solid var(--color-accent); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-top: 10px; overflow-wrap: anywhere; }
.sticky { position: static; }
/* ventanas */
.mbg { display: none; position: fixed; inset: 0; z-index: 900; background: var(--color-overlay); align-items: flex-end; justify-content: center; }
.mbg.open { display: flex; }
.modal { background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border); border-radius: 16px 16px 0 0; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow-lg); }
.modal h3 { margin: 0 0 4px; font-size: 17px; overflow-wrap: anywhere; }
.macts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.macts .btn { flex: 1 1 140px; }
#toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 1300; background: var(--color-success); color: #fff; border-radius: 10px; padding: 11px 16px; font-size: 14px; font-weight: 700; max-width: 380px; width: calc(100% - 32px); text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s; box-shadow: var(--shadow-lg); }
#toast.show { opacity: 1; } #toast.error { background: var(--color-danger); } #toast.warn { background: var(--color-warn); }
/* ficha (papel blanco) */
.ficha-bg { display: none; position: fixed; inset: 0; z-index: 1000; background: var(--color-bg); overflow-y: auto; overflow-x: hidden; }
.ficha-bg.open { display: block; }
html.ficha-abierta, html.ficha-abierta body { overflow: hidden; }
.fbar { position: sticky; top: 0; z-index: 2; background: var(--color-header-bg); color: var(--color-header-text); padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-bottom: 2px solid var(--color-accent); }
.fbar b { flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; }
.fin-wrap { max-width: 860px; margin: 0 auto; padding: 14px 16px 60px; }
.pwrap { overflow: hidden; background: #fff; border-radius: 6px; box-shadow: var(--shadow-lg); border: 1px solid var(--color-border); }
.paper { width: 780px; transform-origin: top left; background: #fff; color: #111; color-scheme: light; font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; font-size: 11.5px; line-height: 1.4; padding: 30px 34px 36px; }
.paper .ph { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; border-bottom: 3px solid #0b2545; padding-bottom: 10px; margin-bottom: 12px; }
.paper .plogo img { max-width: 200px; max-height: 64px; display: block; }
.paper .plogo .emp { font-size: 20px; font-weight: 900; color: #0b2545; }
.paper .ptit { text-align: right; }
.paper .ptit .t1 { font-size: 16px; font-weight: 800; color: #0b2545; }
.paper .ptit .t2 { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; margin-top: 3px; }
.paper .ptit .t3 { color: #555; margin-top: 3px; }

<body>
<div id="header"><div class="hrow">

  <div class="hctl">
    <div class="seg" id="segLang" role="group"><button type="button" data-lang="es" lang="es">ES</button><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="tr" lang="tr">TR</button></div>
    <div class="seg" id="segCur" role="group"><button type="button" data-cur="DOP">RD$</button><button type="button" data-cur="USD">US$</button><button type="button" data-cur="both">RD$ + US$</button></div>
  </div>
</div></div>

  <div class="fin-wrap"><div class="pwrap" id="pWrap"><div class="paper" id="paper"></div></div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// 💼 CAPEX — pantalla (vistas, ventanas, lecturas/escrituras y exportes). El modelo de datos y
// todos los cálculos de dinero y de tiempo están en capex-calc.js; los textos en capex-i18n.js.
const $ = id => document.getElementById(id);
const esc = s => fbEsc(s);
const quien = () => (window.currentUserRole && window.currentUserRole.nombre) || (window.currentUser && window.currentUser.email) || '';
const uidYo = () => (window.currentUser && window.currentUser.uid) || '';
const esAdmin = () => userHasRole('ADMINISTRADOR');
const esEnc = () => userHasRole('ADMINISTRADOR', 'ENCARGADO_MANTENIMIENTO');

const PALETA = { sol: '#3987e5', apr: '#d95926', real: '#199e70', comp: '#c98500' };

// ══════ IDIOMA Y FORMATO (Intl) ══════
const I18N = window.CAPEX_I18N;
const LOCALES = { es: 'es-DO', en: 'en-US', tr: 'tr-TR' };
let LANG = 'es', CUR = 'both';
try { const v = localStorage.getItem('capexLang'); if (LOCALES[v]) LANG = v; } catch (e) {}
try { const v = localStorage.getItem('capexMoneda'); if (['DOP', 'USD', 'both'].includes(v)) CUR = v; } catch (e) {}
window.__i18nFaltan = [];
function t(k, p) {
  let s = I18N[LANG] && I18N[LANG][k];
  if (s == null) { window.__i18nFaltan.push(LANG + ':' + k); s = I18N.es[k] != null ? I18N.es[k] : k; }
  return p ? s.replace(/\{(\w+)\}/g, (m, x) => (p[x] != null ? p[x] : m)) : s;
}
const loc = () => LOCALES[LANG];
const _nf = {};
function fmtNum(v, d) { d = d == null ? 2 : d; const k = loc() + d; if (!_nf[k]) _nf[k] = new Intl.NumberFormat(loc(), { minimumFractionDigits: d, maximumFractionDigits: d }); return _nf[k].format(Number(v) || 0); }
const SIM = { DOP: 'RD$', USD: 'US$' };
function fmtMoney(v, cur) { v = Number(v) || 0; return (v < -0.004 ? '−' : '') + SIM[cur === 'USD' ? 'USD' : 'DOP'] + '\u00a0' + fmtNum(Math.abs(v), 2); }
function fmtPct(v, d) { if (v == null || !isFinite(v)) return '—'; return new Intl.NumberFormat(loc(), { style: 'percent', minimumFractionDigits: 0, maximumFractionDigits: d == null ? 1 : d }).format(v / 100); }
function fmtCompact(v) { return new Intl.NumberFormat(loc(), { notation: 'compact', maximumFractionDigits: 1 }).format(Number(v) || 0); }
function fmtDate(f) { const d = fbParseFecha(f); return d ? new Intl.DateTimeFormat(loc(), { day: '2-digit', month: 'short', year: 'numeric' }).format(d) : '—'; }
function fmtDateCorta(f) { const d = fbParseFecha(f); return d ? new Intl.DateTimeFormat(loc(), { day: '2-digit', month: 'short' }).format(d) : '—'; }
function fmtDateTime(iso) { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? new Intl.DateTimeFormat(loc(), { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(d) : '—'; }
const fmtYears = v => v == null || !isFinite(v) ? '—' : t('years', { n: fmtNum(v, 1) });
const fmtDays = n => n === 1 ? t('day1') : t('days', { n: fmtNum(n, 0) });
const lbl = (pre, k) => k ? t(pre + k) : '—';
// Monto en la moneda elegida arriba (RD$ / US$ / las dos). v en la moneda base B del proyecto.
function dinero(v, B, tasa, corto) {
  const dop = conv(v, B, 'DOP', tasa), usd = conv(v, B, 'USD', tasa);
  return dineroPar(dop, usd, corto);
}
function dineroPar(dop, usd, corto) {
  if (CUR === 'DOP') return esc(fmtMoney(dop, 'DOP'));
  if (CUR === 'USD') return esc(fmtMoney(usd, 'USD'));
  return corto ? esc(fmtMoney(dop, 'DOP')) + ' <small>· ' + esc(fmtMoney(usd, 'USD')) + '</small>' : `<span class="dual">${esc(fmtMoney(dop, 'DOP'))}<small>${esc(fmtMoney(usd, 'USD'))}</small></span>`;
}
const monVista = () => (CUR === 'USD' ? 'USD' : 'DOP');

// ══════ ESTADO DE LA PANTALLA ══════
let CFG = { tasaCambio: 63, contingenciaPct: 10, itbisPct: 18, empresa: '' };
let PRES = null;              // /capex_config/general (solo Administrador)
let LOGO;                     // undefined = sin leer; null = no hay
let ubic = null;
const CACHE_ANIO = new Map(); // año → [proyectos]
const UI = { vista: 'port', id: null, anio: new Date().getFullYear(), estado: '', tipo: '', q: '' };
let EDIT = null;              // { id, d, dirty, orig }
let STOCK = { cod: new Map(), desc: new Map() };
let EQ_DOCS = [];
const charts = {};
window.__capexLecturas = 0;

let _toastT;
function toast(msg, tipo) { const el = $('toast'); el.textContent = msg; el.className = 'show' + (tipo ? ' ' + tipo : ''); clearTimeout(_toastT); _toastT = setTimeout(() => { el.className = ''; }, 3600); }
const fallo = e => { console.warn(e); toast('❌ ' + (e && e.code === 'permission-denied' ? t('err_perm') : e && e.code === 'aborted' ? t('err_conflict') : (e && e.message) || 'Error'), 'error'); };
function abrirModal(html) { $('modal').innerHTML = html; $('mbg').classList.add('open'); const f = $('modal').querySelector('input,select,textarea,button'); if (f) setTimeout(() => f.focus({ preventScroll: true }), 30); }
function cerrarModal() { $('mbg').classList.remove('open'); $('modal').innerHTML = ''; }
$('mbg').addEventListener('click', e => { if (e.target.id === 'mbg') cerrarModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('mbg').classList.contains('open')) cerrarModal(); else if ($('fichaBg').classList.contains('open')) cerrarFicha(); } });
// Escritura que no deja la pantalla esperando sin señal (Firestore la sube sola después).
function conLimite(prom, ms) { return Promise.race([prom, new Promise(r => setTimeout(() => r('pendiente'), ms || 4000))]); }

// ══════ CABECERA, IDIOMA Y MONEDA ══════
function pintarCabecera() {
  document.documentElement.lang = LANG === 'es' ? 'es-DO' : LANG === 'en' ? 'en' : 'tr';
  document.title = 'CAPEX — ' + t('appTitle').split('·').pop().trim();
  $('hTitle').textContent = '💼 ' + t('appTitle');
  const u = window.currentUserRole || {};
  $('hSub').innerHTML = esc(t('appSub')) + (u.nombre ? ' · <span class="ut">' + esc(u.nombre) + '</span>' : '');
  $('segLang').setAttribute('aria-label', t('lang')); $('segCur').setAttribute('aria-label', t('currency'));
  $('segLang').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  $('segCur').querySelectorAll('button').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.cur === CUR)); if (b.dataset.cur === 'both') b.title = t('both'); });
  $('fClose').textContent = '← ' + t('a_closeWin'); $('fPrint').textContent = '🖨 ' + t('a_print'); $('fXls').textContent = '⬇ ' + t('a_xls');
}
$('segLang').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (!b) return; setLang(b.dataset.lang); });
$('segCur').addEventListener('click', e => { const b = e.target.closest('[data-cur]'); if (!b) return; CUR = b.dataset.cur; try { localStorage.setItem('capexMoneda', CUR); } catch (er) {} pintarCabecera(); repintar(); });
function setLang(l) {
  if (!LOCALES[l]) return; LANG = l;
  if ($('mbg').classList.contains('open')) cerrarModal();
  try { localStorage.setItem('capexLang', l); } catch (e) {}
  pintarCabecera(); traducirFiltro(); repintar();
}
// La barra de filtros compartida (filtros.js) escribe "Todas las naves/áreas": se traduce aquí.
function traducirFiltro() {
  const el = $('fUbic'); if (!el) return;
  el.querySelectorAll('select[data-fbf]').forEach(s => {
    const o = s.querySelector('option[value=""]'), nv = s.dataset.fbf;
    if (o && nv === 'nave') o.textContent = fbMisNaves() ? t('myNaves') : t('allNaves');
    if (o && nv === 'area') o.textContent = t('allAreas');
    s.setAttribute('aria-label', nv === 'nave' ? t('f_nave') : t('f_area'));
    s.querySelectorAll('optgroup').forEach(g => { g.label = t('inactive'); });
  });
}
function repintar() {
  if (UI.vista === 'edit' && EDIT) { pintarEditor(); return; }
  if ($('fichaBg').classList.contains('open') && FICHA) pintarFicha(FICHA);
  pintar();
}

// ══════ LECTURAS ══════
async function cargarConfig() {
  try { const s = await db.collection('config').doc('capex').get(); window.__capexLecturas++; if (s.exists) CFG = { ...CFG, ...s.data() }; }
  catch (e) { console.warn('config/capex:', e.message); }
  if (esAdmin()) {
    try { const s = await db.collection('capex_config').doc('general').get(); window.__capexLecturas++; PRES = s.exists ? s.data() : {}; }
    catch (e) { console.warn('capex_config:', e.message); PRES = {}; }
  }
}
async function cargarAnio(y, fresco) {
  if (!fresco && CACHE_ANIO.has(y)) return CACHE_ANIO.get(y);
  const s = await db.collection('capex').where('anioFiscal', '==', y).get();
  window.__capexLecturas += Math.max(1, s.size);
  const l = s.docs.map(d => ({ id: d.id, ...d.data() }));
  CACHE_ANIO.set(y, l);
  return l;
}
function enCache(id) { for (const l of CACHE_ANIO.values()) { const p = l.find(x => x.id === id); if (p) return p; } return null; }
function guardarEnCache(p) {
  for (const [y, l] of CACHE_ANIO) { const i = l.findIndex(x => x.id === p.id); if (i >= 0) { if (y === p.anioFiscal) l[i] = p; else l.splice(i, 1); } }
  const l = CACHE_ANIO.get(p.anioFiscal); if (l && !l.some(x => x.id === p.id)) l.push(p);
}
async function proyecto(id, fresco) {
  if (!fresco) { const c = enCache(id); if (c) return c; }
  const s = await db.collection('capex').doc(id).get(); window.__capexLecturas++;
  if (!s.exists) return null;
  const p = { id: s.id, ...s.data() }; guardarEnCache(p); return p;
}
// Stock de los repuestos: del catálogo de equipos en caché (0 lecturas extra), por código y por nombre.
function prepararStock(docs) {
  STOCK = { cod: new Map(), desc: new Map() };
  EQ_DOCS = docs || [];
  EQ_DOCS.forEach(d => {
    const x = (d.data && d.data()) || {};
    (Array.isArray(x.repuestos) ? x.repuestos : []).forEach(r => {
      const q = parseFloat(r.q); if (!isFinite(q)) return;
      [r.m, r.modelo].forEach(c => { const k = K(c); if (k) STOCK.cod.set(k, (STOCK.cod.get(k) || 0) + q); });
      const k = K(r.r); if (k) STOCK.desc.set(k, (STOCK.desc.get(k) || 0) + q);
    });
  });
}
function stockDe(r) {
  const kc = K(r.codigo), kd = K(r.descripcion);
  if (kc && STOCK.cod.has(kc)) return STOCK.cod.get(kc);
  if (kd && STOCK.desc.has(kd)) return STOCK.desc.get(kd);
  return null;
}
const stockHtml = n => n == null ? '' : n > 0 ? `<span class="stock sem-ok">📦 ${esc(t('r_hay', { n: fmtNum(n, n % 1 ? 1 : 0) }))}</span>` : `<span class="stock sem-bad">${esc(t('r_nohay'))}</span>`;

// ══════ RUTAS (#p=ID · #nuevo · #nuevo&equipo=ID · #nuevo&dup=ID · #editar=ID) ══════
function leerHash() {
  const h = (location.hash || '').slice(1), q = {};
  h.split('&').forEach(x => { const i = x.indexOf('='); if (x) q[i < 0 ? x : x.slice(0, i)] = i < 0 ? '' : decodeURIComponent(x.slice(i + 1)); });
  return q;
}
function ir(hash) { if (location.hash === hash || (hash === '#' && !location.hash)) route(); else location.hash = hash; }
window.addEventListener('hashchange', () => route());
// Cerrar la pestaña o recargar con cambios sin guardar en el editor: el navegador pregunta.
window.addEventListener('beforeunload', e => { if (EDIT && EDIT.dirty) { e.preventDefault(); e.returnValue = ''; } });
let _ignorarHash = false;
async function route() {
  if (_ignorarHash) { _ignorarHash = false; return; } // volvimos al editor: se queda tal cual
  if (EDIT && EDIT.dirty) {
    const q0 = leerHash();
    const sigue = ('nuevo' in q0 && !EDIT.id) || (q0.editar && q0.editar === EDIT.id);
    if (!sigue && !confirm(t('unsaved'))) { _ignorarHash = true; history.back(); return; }
  }
  const q = leerHash();
  if ('nuevo' in q) { UI.vista = 'edit'; await abrirEditor(null, q); }
  else if (q.editar) { UI.vista = 'edit'; await abrirEditor(q.editar, q); }
  else if (q.p) { UI.vista = 'det'; UI.id = q.p; EDIT = null; await pintar(); }
  else { UI.vista = 'port'; EDIT = null; await pintar(); }
  window.scrollTo(0, 0);
}
async function pintar() {
  Object.keys(charts).forEach(k => { try { charts[k].destroy(); } catch (e) {} delete charts[k]; });
  $('portWrap').style.display = UI.vista === 'port' ? '' : 'none';
  window.__capexVista = UI.vista;
  if (UI.vista === 'port') await vistaPortafolio();
  else if (UI.vista === 'det') await vistaDetalle();
  window.__capexListo = true;
}

// ══════ PORTAFOLIO ══════
const coincideTexto = (p, q) => { if (!q) return true; const k = K(q); return [p.codigo, p.titulo, p.area, p.linea, fbNaveDe(p), ...(p.equipos || []).map(e => e.nombre)].some(x => K(x).includes(k)); };
const accesoCapex = x => ({ area: x.area || '', linea: x.linea || '', equipoId: (x.equipoIds || [])[0] || '', equipo: '' });
function pintarHerramientas() {
  const y0 = new Date().getFullYear(), anios = [];
  for (let y = y0 + 2; y >= y0 - 3; y--) anios.push(y);
  if (!anios.includes(UI.anio)) anios.push(UI.anio);
  $('portTools').innerHTML = `<div class="tools">
      <div><label class="f" for="tAnio">${esc(t('year'))}</label><select id="tAnio">${anios.map(y => `<option value="${y}"${y === UI.anio ? ' selected' : ''}>${y}</option>`).join('')}</select></div>
      <div><label class="f" for="tEst">${esc(t('f_estado'))}</label><select id="tEst"><option value="">${esc(t('allStates'))}</option>${ESTADOS.map(e => `<option value="${e}"${e === UI.estado ? ' selected' : ''}>${esc(t('st_' + e))}</option>`).join('')}</select></div>
      <div class="tipo"><label class="f" for="tTipo">${esc(t('f_tipo'))}</label><select id="tTipo"><option value="">${esc(t('allTypes'))}</option>${TIPOS.map(e => `<option value="${e}"${e === UI.tipo ? ' selected' : ''}>${esc(t('tp_' + e))}</option>`).join('')}</select></div>
      <div class="full"><label class="f" for="tQ">🔎 ${esc(t('search'))}</label><input id="tQ" type="search" value="${esc(UI.q)}" autocomplete="off"></div>
    </div>
    <div class="btns" style="margin:4px 0 10px">
      <a class="btn" href="#nuevo" id="bNuevo">${esc(t('newCapex'))}</a>
      <button type="button" class="btn sec" id="bXlsPort">⬇ ${esc(t('a_xlsPortfolio'))}</button>
      ${esAdmin() ? `<button type="button" class="btn sec" id="bPres">💰 ${esc(t('budget'))}</button><button type="button" class="btn sec" id="bCfg">⚙️ ${esc(t('settings'))}</button>` : ''}
      <button type="button" class="btn sec" id="bAct" aria-label="${esc(t('refresh'))}" title="${esc(t('refresh'))}">🔄</button>
    </div>`;
  $('tAnio').onchange = e => { UI.anio = Number(e.target.value); pintar(); };
  $('tEst').onchange = e => { UI.estado = e.target.value; pintar(); };
  $('tTipo').onchange = e => { UI.tipo = e.target.value; pintar(); };
  let _qT; $('tQ').oninput = e => { clearTimeout(_qT); _qT = setTimeout(() => { UI.q = e.target.value.trim(); pintar(); }, 250); };
  $('bXlsPort').onclick = () => exportarPortafolio();
  $('bAct').onclick = async () => { CACHE_ANIO.delete(UI.anio); await pintar(); };
  if ($('bPres')) $('bPres').onclick = () => modalPresupuesto();
  if ($('bCfg')) $('bCfg').onclick = () => modalAjustes();
}
function presupuestoAnio(y) {
  const a = PRES && PRES.presupuestos && PRES.presupuestos[String(y)];

function ganttHtml(p, cr, conReal, papel) {
  const items = cr.items || [];
  if (!items.length && !cr.leadTimeMax) return `<div class="nota">${esc(t('c_noWork'))}</div>`;
  const total = Math.max(1, cr.duracionDias), hoy = fbHoy();
  const pos = d => Math.max(0, Math.min(100, d / total * 100));
  const dHoy = diasEntre(cr.fechaInicio, hoy);
  const marca = dHoy >= 0 && dHoy <= total ? `<i class="today" style="left:${pos(dHoy).toFixed(2)}%" title="${esc(t('c_today'))}"></i>` : '';
  const av = p.avance || {};
  let h = `<div class="gantt" role="img" aria-label="${esc(t('c_ganttAria'))}">`;
  if (cr.leadTimeMax > 0) h += `<div class="gr"><div class="gl">📦 ${esc(t('c_lead'))}<small>${esc(fmtDate(cr.fechaInicio))} → ${esc(fmtDate(sumarDias(cr.fechaInicio, cr.leadTimeMax)))} · ${esc(fmtDays(cr.leadTimeMax))}</small></div><div class="gt">${marca}<i class="gb mat" style="left:0;width:${pos(cr.leadTimeMax).toFixed(2)}%"></i></div></div>`;
  items.forEach(x => {
    const tr = (p.trabajos || [])[x.i] || {}, a = av[String(x.i)] || {}, pct = Math.min(100, Math.max(0, num(a.pct)));
    const late = conReal ? atrasoTrabajo(x, a, hoy) : 0;
    let real = '';
    if (conReal && a.ini) { const ri = diasEntre(cr.fechaInicio, a.ini), rf = a.fin ? diasEntre(cr.fechaInicio, a.fin) + 1 : Math.max(ri + 1, dHoy + 1); real = `<i class="gb real" style="left:${pos(ri).toFixed(2)}%;width:${Math.max(0.8, pos(rf) - pos(ri)).toFixed(2)}%" title="${esc(t('c_real'))}"></i>`; }
    h += `<div class="gr" data-gi="${x.i}"><div class="gl"><span class="ut">${x.i + 1}. ${esc(tr.descripcion || '—')}</span><small>${esc(fmtDate(x.desde))} → ${esc(fmtDate(x.hasta))} · ${esc(fmtDays(x.dur))}${conReal ? ' · ' + esc(fmtPct(pct, 0)) + (late ? ' · <b class="sem-bad">' + esc(t('c_late', { n: fmtDays(late) })) + '</b>' : '') : ''}</small></div>
      <div class="gt">${marca}<i class="gb${late ? ' late' : ''}" style="left:${pos(x.ini).toFixed(2)}%;width:${Math.max(0.8, pos(x.fin) - pos(x.ini)).toFixed(2)}%" title="${esc(t('c_plan'))}">${conReal && pct ? `<i class="pv" style="width:${pct}%"></i>` : ''}</i>${real}</div></div>`;
  });
  const nt = papel ? 4 : (window.innerWidth < 640 ? 1 : 3), ticks = [], vistos = new Set();
  const corta = cr.fechaInicio.slice(0, 4) === sumarDias(cr.fechaInicio, total - 1).slice(0, 4);
  for (let k = 0; k <= nt; k++) {
    const d = Math.round(total * k / nt), f = sumarDias(cr.fechaInicio, Math.max(0, Math.min(d, total - 1))), x = pos(d);
    if (vistos.has(f)) continue; vistos.add(f);
    ticks.push(`<span style="left:${x.toFixed(2)}%;transform:translateX(${x > 85 ? '-100%' : x < 15 ? '0' : '-50%'})">${esc(corta && !(papel && k === 0) ? fmtDateCorta(f) : fmtDate(f))}</span>`);
  }
  h += `<div class="gx"><div></div><div class="ticks">${ticks.join('')}</div></div></div>`;
  return h;
}

function accion(a, p, cr) {
  if (a === 'editar') return ir('#editar=' + encodeURIComponent(p.id));
  if (a === 'dup') return ir('#nuevo&dup=' + encodeURIComponent(p.id));
  if (a === 'ficha') return abrirFicha(p);
  if (a === 'xls') return exportarProyecto(p);
  if (a === 'compras') return exportarCompras(p);
  if (a === 'revisar') return modalAprobacion(p);
  if (a === 'gasto') return modalGasto(p);
  if (a === 'fechaIni') return modalFechaInicio(p, cr);
  if (a === 'enviar') {
    const errs = validar(p);
    if (errs.length) { toast(t('v_fix') + ' ' + errs.join(' '), 'error'); return; }
    return modalTransicion(p, 'enviado', 'a_send', false);
  }
  if (a === 'retirar') return modalTransicion(p, 'borrador', 'a_withdraw', false);
  if (a === 'iniciar') return modalTransicion(p, 'en_ejecucion', 'a_start', false);
  if (a === 'cerrar') return modalTransicion(p, 'cerrado', 'a_close', false);
  if (a === 'cancelar') return modalTransicion(p, 'cancelado', 'a_cancel', true);
  if (a === 'reabrir') return modalTransicion(p, 'borrador', 'a_reopen', true);
}

const BORRAR = Object.freeze({ borrar: true }); // campo que se quita del documento (FieldValue.delete)
function entradaHistorial(estado, nota, accion) { const e = { estado, por: quien(), uid: uidYo(), en: new Date().toISOString(), nota: String(nota || '').slice(0, 1000) }; if (accion) e.accion = accion; return e; }
async function cambiarProyecto(p, armar) {
  if (!navigator.onLine) throw Object.assign(new Error(t('err_offline')), { code: 'unavailable' });
  const ref = db.collection('capex').doc(p.id);
  const res = await db.runTransaction(async tx => {
    const s = await tx.get(ref);
    if (!s.exists) throw Object.assign(new Error(t('notFound')), { code: 'not-found' });
    const cur = { id: s.id, ...s.data() };
    const upd = armar(cur);
    if (!upd) throw Object.assign(new Error(t('err_conflict')), { code: 'aborted' });
    const w = {}; Object.keys(upd).forEach(k => { w[k] = upd[k] === BORRAR ? firebase.firestore.FieldValue.delete() : upd[k]; });
    tx.update(ref, { ...w, updatedAt: fbTimestamp(), actualizadoPor: quien() });
    return { cur, upd };
  });
  const loc = { ...res.cur };
  Object.keys(res.upd).forEach(k => {
    const v = res.upd[k];
    if (v === BORRAR) { delete loc[k]; return; }
    if (k.includes('.')) { const [a, b] = k.split('.'); loc[a] = { ...(loc[a] || {}), [b]: v }; } else loc[k] = v;
  });
  guardarEnCache(loc);
  return loc;
}

function reducirLogo(file) {
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 400 / img.width, 140 / img.height), w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
      let data = c.toDataURL('image/png'); let tipo = 'png';
      if (data.length > 250000) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h); data = c.toDataURL('image/jpeg', 0.85); tipo = 'jpeg'; }
      URL.revokeObjectURL(url); res(data.length <= 300000 ? { data, tipo, ancho: w, alto: h } : null);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}

    const hr = ws.getRow(4);
