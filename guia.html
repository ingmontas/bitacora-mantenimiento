<style>
  /* ══════════════════════════════════════════════════════════════════
     GUÍA DE INICIO POR NAVE (26 oct 2026, Etapa 5)
     Explica a cada rol cómo usar la app, para que una nave o un técnico
     nuevo empiece sin que el dueño tenga que explicarlo todo.
     - La sección del rol de la persona sale primero y abierta
       (window.currentUserRole, ya leído al iniciar sesión: 0 lecturas).
     - Buscador que filtra en el celular, sin internet.
     - "Abrir una nave nueva" (Administrador): progreso guardado en ESTE
       celular (localStorage), por nombre de nave.
     - Se puede imprimir (abre todas las secciones al imprimir).
     Esta página no lee ni escribe nada en Firebase.
     ══════════════════════════════════════════════════════════════════ */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); }
  body { min-height: 100vh; font-size: 15px; line-height: 1.5; overflow-x: hidden; }
  #header { background: var(--color-header-bg); color: var(--color-header-text); border-bottom: 2px solid var(--color-accent); padding: 14px 16px; }
  #header .in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #header h1 { font-size: 17px; font-weight: 800; }
  #header small { font-size: 10.5px; color: var(--color-header-sub); font-weight: 600; text-transform: uppercase; display: block; margin-top: 1px; letter-spacing: .02em; }
  #header .acc { display: flex; gap: 6px; flex-shrink: 0; }
  .gtools { max-width: 680px; margin: 0 auto; padding: 12px 16px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gtools small { flex: 1; color: var(--color-muted); font-size: 13px; font-weight: 600; }
  .hbtn { background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 7px 10px; font: inherit; font-size: 12.5px; font-weight: 700; text-decoration: none; cursor: pointer; white-space: nowrap; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 14px 16px 60px; }
  .intro { font-size: 14px; color: var(--color-text-2); margin-bottom: 12px; }
  .buscar { position: relative; margin-bottom: 8px; }
  .buscar input { width: 100%; font: inherit; font-size: 16px; padding: 11px 38px 11px 38px; border: 1px solid var(--color-border-strong); border-radius: var(--radius); }
  .buscar .lupa { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
  .buscar input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .buscar button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--color-muted); font-size: 18px; padding: 4px 8px; cursor: pointer; display: none; }
  .buscar.con button { display: block; }
  #resBusqueda { font-size: 12.5px; color: var(--color-muted); margin-bottom: 8px; }
  #resBusqueda:empty { margin: 0; }
  .sin-res { display: none; text-align: center; color: var(--color-muted); padding: 24px 10px; background: var(--color-surface); border: 1px dashed var(--color-border-strong); border-radius: var(--radius); margin-bottom: 10px; }

  details.sec { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; }
  details.sec > summary { list-style: none; cursor: pointer; padding: 14px 14px; display: flex; align-items: center; gap: 12px; user-select: none; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary .ic .vt-ico { width: 24px; height: 24px; }
  details.sec > summary .ic { font-size: 26px; width: 44px; height: 44px; border-radius: 12px; background: var(--color-surface-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  details.sec > summary .tx { flex: 1; min-width: 0; }
  details.sec > summary b { display: block; font-size: 16px; font-weight: 700; }
  details.sec > summary span.sub { display: block; font-size: 12.5px; color: var(--color-muted); line-height: 1.4; }
  details.sec > summary .chev { color: var(--color-muted); transition: transform .15s; flex-shrink: 0; }
  details.sec[open] > summary .chev { transform: rotate(180deg); }
  details.sec.mio { border-color: var(--color-accent); }
  .tag-mio { display: inline-block; background: var(--color-accent-soft); color: var(--color-accent-text); border: 1px solid var(--color-accent); border-radius: var(--radius-pill); font-size: 10.5px; font-weight: 700; padding: 1px 8px; margin-left: 4px; vertical-align: 2px; }
  .cuerpo { padding: 0 14px 12px; border-top: 1px solid var(--color-border); }
  .it { padding: 12px 0; border-bottom: 1px solid var(--color-border); }
  .it:last-child { border-bottom: none; }
  .it h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .it p { font-size: 14px; color: var(--color-text-2); margin-bottom: 6px; }
  .it p:last-child { margin-bottom: 0; }
  .it ol, .it ul { padding-left: 22px; font-size: 14px; color: var(--color-text-2); }
  .it li { margin-bottom: 4px; }
  .it b, .it strong { color: var(--color-text); }
  .it .ojo { background: var(--color-warn-soft); color: var(--color-text); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13.5px; margin-top: 6px; }
  .it .ojo.rojo { background: var(--color-danger-soft); }
  .ir { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--color-primary-text); text-decoration: none; border: 1px solid var(--color-border-strong); background: var(--color-surface-2); border-radius: var(--radius-pill); padding: 4px 12px; }
  .ir + .ir { margin-left: 6px; }
  .k { display: inline; font-weight: 700; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 6px; padding: 0 5px; color: var(--color-text); -webkit-box-decoration-break: clone; box-decoration-break: clone; overflow-wrap: anywhere; }
  mark { background: var(--color-accent-soft); color: inherit; border-radius: 3px; box-shadow: 0 0 0 1px var(--color-accent); }

  /* Abrir una nave nueva */
  .nn-nave { display: flex; gap: 8px; align-items: center; margin: 12px 0 8px; flex-wrap: wrap; }
  .nn-nave label { font-size: 13px; font-weight: 700; color: var(--color-text-2); }
  .nn-nave input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 9px 10px; border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm); }
  .nn-barra { height: 10px; border-radius: 99px; background: var(--color-surface-3); overflow: hidden; margin: 6px 0 4px; }
  .nn-barra > i { display: block; height: 100%; width: 0; background: var(--color-success); transition: width .2s; }
  #nnTxt { font-size: 12.5px; color: var(--color-muted); }
  .paso { display: flex; gap: 10px; align-items: flex-start; }
  .paso input[type=checkbox] { width: 22px; height: 22px; margin-top: 2px; flex-shrink: 0; accent-color: var(--color-success); }
  .paso .pc { flex: 1; min-width: 0; }
  .paso.hecho h3 { text-decoration: line-through; color: var(--color-muted); }
  .nn-reset { background: none; border: none; color: var(--color-muted); font: inherit; font-size: 12.5px; text-decoration: underline; cursor: pointer; margin-top: 8px; }

  .pie { margin-top: 18px; font-size: 12px; color: var(--color-muted); text-align: center; line-height: 1.6; }

  /* Impresión: todo abierto, sin barra, sin buscador, blanco y negro. */
  @media print {
    #fbMiniNav, .no-print, .buscar, #resBusqueda, .nn-reset, #fbErrArranque { display: none !important; }
    html, body { background: #fff !important; color: #000 !important; }
    #header { background: #fff !important; color: #000 !important; border-bottom: 2px solid #000; padding: 0 0 8px; }
    #header small { color: #333 !important; }
    .wrap { max-width: none; padding: 10px 0 0; }
    details.sec { box-shadow: none; border: 1px solid #999; break-inside: auto; background: #fff !important; }
    details.sec > summary .chev { display: none; }
    details.sec > summary .ic { background: none; }
    .it { break-inside: avoid; }
    .it p, .it ol, .it ul, details.sec > summary span.sub { color: #222 !important; }
    .it b, .it strong, .it h3 { color: #000 !important; }
    .ir { border: none; background: none; padding: 0; color: #000 !important; font-weight: 400; }
    .ir::after { content: " (" attr(href) ")"; font-size: 11px; color: #555; }
    .it .ojo { background: #f1f1f1 !important; border: 1px solid #ccc; }
    .sin-res { display: none !important; }
    details.sec.oculto, .it.oculto { display: block !important; }
  }
  .oculto { display: none !important; }
</style>
</head>
<body>
<!-- (v3 etapa 3a) Un solo encabezado por pantalla: el de la app (título, usuario, nave, idioma). -->
<!-- (v3 etapa 3b) El contenido de la guía viene de i18n/guia.js en el idioma elegido (es · en · tr). -->
<div class="gtools no-print">
  <small id="header-sub"></small>
  <a class="hbtn" id="volver" href="index.html" style="display:none"></a>
  <button class="hbtn" type="button" id="bImprimir" onclick="imprimirGuia()"><span data-icon="printer"></span> <span id="tImprimir"></span></button>
</div>

<div class="wrap" data-i18n-no>
  <p class="intro" id="intro"></p>
  <div class="buscar" id="buscarBox">
    <span class="lupa" data-icon="search"></span>
    <input type="search" id="buscar" autocomplete="off"/>
    <button type="button" id="limpiar"><span data-icon="x"></span></button>
  </div>
  <div id="resBusqueda" aria-live="polite"></div>
  <div class="sin-res" id="sinRes"></div>
  <div id="secciones"></div>
  <div class="pie" id="pie"></div>
</div>

<script>
// ══════ Contenido por idioma (i18n/guia.js) ══════
const ROL_SECCION = { OPERADOR: 'sec-operador', TECNICO: 'sec-tecnico', SUPERVISOR: 'sec-supervisor', ENCARGADO_MANTENIMIENTO: 'sec-supervisor', ALMACEN: 'sec-almacen', RRHH: 'sec-rrhh', ADMINISTRADOR: 'sec-admin' };
const $ = id => document.getElementById(id);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const escG = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lang = () => (window.i18n && GUIA_CONTENIDO[i18n.getLang()] ? i18n.getLang() : 'es');
const G = () => GUIA_CONTENIDO[lang()];
const U = (k, p) => String(G().ui[k] || GUIA_CONTENIDO.es.ui[k] || '').replace(/\{(\w+)\}/g, (x, n) => (p && p[n] != null ? p[n] : x));
const ROL_TXT = () => ({ OPERADOR: 'rol_OPERADOR', TECNICO: 'rol_TECNICO', SUPERVISOR: 'rol_SUPERVISOR', ENCARGADO_MANTENIMIENTO: 'rol_ENCARGADO_MANTENIMIENTO', ALMACEN: 'rol_ALMACEN', RRHH: 'rol_RRHH', ADMINISTRADOR: 'rol_ADMINISTRADOR' });
let ROL = '';

function htmlIr(ir) { return (ir || []).map(([h, t]) => `<a class="ir" href="${escG(h)}">${escG(t)} →</a>`).join(''); }
function htmlSeccion(sec) {
  const cab = `<summary><span class="ic"><span data-icon="${escG(sec.ic)}"></span></span><span class="tx"><b>${escG(sec.t)}</b><span class="sub">${escG(sec.sub)}</span></span><span class="chev"><span data-icon="chevron-down"></span></span></summary>`;
  let cuerpo;
  if (sec.pasos) {
    cuerpo = `<div class="nn-nave"><label for="nnNave">${escG(U('nnNave'))}</label><input id="nnNave" list="nnNaves" maxlength="80" placeholder="${escG(U('nnPh'))}" autocomplete="off"/><datalist id="nnNaves"></datalist></div>`
      + `<div class="nn-barra" aria-hidden="true"><i id="nnBarra"></i></div><div id="nnTxt"></div><div id="nnPasos">`
      + sec.pasos.map((p, i) => `<div class="it paso" data-paso="${escG(p.k)}"><input type="checkbox" id="nn-${escG(p.k)}" aria-label="${escG(U('nnPaso', { n: i + 1 }))}"/><div class="pc"><h3>${escG(p.h)}</h3>${p.b}${htmlIr(p.ir)}</div></div>`).join('')
      + `</div><button type="button" class="nn-reset no-print" id="nnReset">${escG(U('nnReset'))}</button>`;
  } else {
    cuerpo = sec.items.map(it => `<div class="it"><h3>${escG(it.h)}</h3>${it.b}${htmlIr(it.ir)}</div>`).join('');
  }
  return `<details class="sec" id="${escG(sec.id)}" data-roles="${escG(sec.roles)}"${sec.solo ? ` data-solo="${escG(sec.solo)}"` : ''}>${cab}<div class="cuerpo">${cuerpo}</div></details>`;
}
function pintarGuia() {
  const abiertas = new Set([...document.querySelectorAll('#secciones > details.sec')].filter(d => d.open).map(d => d.id));
  const primera = !document.querySelector('#secciones > details.sec');
  const nave = $('nnNave') ? $('nnNave').value : null;
  document.title = U('titulo') + ' — ' + (window.i18n ? i18n.t('appNombre') : 'Mantenimiento 2026');
  $('intro').textContent = U('intro');
  $('buscar').placeholder = U('buscarPh'); $('buscar').setAttribute('aria-label', U('buscarAria'));
  $('limpiar').setAttribute('aria-label', U('limpiar'));
  $('sinRes').textContent = U('sinRes');
  $('pie').textContent = U('pie');
  $('tImprimir').textContent = U('imprimir');
  $('secciones').innerHTML = G().secs.map(htmlSeccion).join('');
  prepararPorRol(ROL, primera);
  if (!primera) document.querySelectorAll('#secciones > details.sec').forEach(d => { d.open = abiertas.has(d.id); });
  if (nave != null && $('nnNave')) $('nnNave').value = nave;
  nnIniciar(nave != null);
  if ($('buscar').value.trim()) { _abiertasAntes = null; buscar(); }
  if (window.VTIcons) VTIcons.hydrate(document);
}

function prepararPorRol(rol, abrir) {
  ROL = rol || '';
  const cont = $('secciones');
  // La "nave nueva" es solo para el Administrador.
  cont.querySelectorAll('[data-solo]').forEach(d => { if (!d.dataset.solo.split(',').includes(ROL)) d.remove(); });
  const id = ROL_SECCION[ROL];
  const mia = id && $(id);
  if (mia) {
    cont.insertBefore(mia, cont.firstChild);
    if (abrir !== false) mia.open = true;
    mia.classList.add('mio');
    mia.querySelector('summary b').insertAdjacentHTML('beforeend', ` <span class="tag-mio">${escG(U('tuRol'))}</span>`);
    const nn = $('sec-nave-nueva');
    if (nn) mia.after(nn);
  }
  if (ROL_TXT()[ROL] && window.i18n) $('header-sub').textContent = i18n.t(ROL_TXT()[ROL]);
  // Operador y RR.HH. no tienen la barra de páginas (no tienen permiso en las demás).
  const v = $('volver');
  if (ROL === 'OPERADOR') { v.href = 'reportar.html'; v.textContent = '← ' + U('volverRep'); v.style.display = ''; }
  else if (ROL === 'RRHH') { v.href = 'herramientas.html#rrhh'; v.textContent = '← ' + U('volver'); v.style.display = ''; }
}

// ══════ Buscador ══════
function quitarMarcas(el) {
  el.querySelectorAll('mark').forEach(m => { const t = document.createTextNode(m.textContent); m.replaceWith(t); });
  el.normalize();
}
function marcar(el, q) {
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  const nodos = [];
  while (w.nextNode()) nodos.push(w.currentNode);
  nodos.forEach(n => {
    const t = n.nodeValue, nt = norm(t);
    if (nt.length !== t.length) return;
    let i = nt.indexOf(q);
    if (i < 0) return;
    const frag = document.createDocumentFragment();
    let desde = 0;
    while (i >= 0) {
      frag.appendChild(document.createTextNode(t.slice(desde, i)));
      const m = document.createElement('mark'); m.textContent = t.slice(i, i + q.length); frag.appendChild(m);
      desde = i + q.length; i = nt.indexOf(q, desde);
    }
    frag.appendChild(document.createTextNode(t.slice(desde)));
    n.replaceWith(frag);
  });
}
let _abiertasAntes = null;
function buscar() {
  const q = norm($('buscar').value.trim());
  $('buscarBox').classList.toggle('con', !!q);
  const secs = [...document.querySelectorAll('#secciones > details.sec')];
  secs.forEach(s => quitarMarcas(s));
  if (!q) {
    secs.forEach(s => { s.classList.remove('oculto'); s.querySelectorAll('.it').forEach(i => i.classList.remove('oculto')); });
    if (_abiertasAntes) { secs.forEach(s => { s.open = _abiertasAntes.has(s.id); }); _abiertasAntes = null; }
    $('resBusqueda').textContent = '';
    $('sinRes').style.display = 'none';
    return;
  }
  if (!_abiertasAntes) _abiertasAntes = new Set(secs.filter(s => s.open).map(s => s.id));
  let total = 0, nSec = 0;
  secs.forEach(s => {
    const titulo = norm(s.querySelector('summary').textContent).includes(q);
    const its = [...s.querySelectorAll('.cuerpo .it')];
    let n = 0;
    its.forEach(it => {
      const si = titulo || norm(it.textContent).includes(q);
      it.classList.toggle('oculto', !si);
      if (si) n++;
    });
    const ver = titulo || n > 0;
    s.classList.toggle('oculto', !ver);
    s.open = ver;
    if (ver) { nSec++; total += n; marcar(s, q); }
  });
  $('sinRes').style.display = nSec ? 'none' : 'block';
  $('resBusqueda').textContent = nSec ? U(total === 1 && nSec === 1 ? 'res1' : 'resN', { n: window.i18n ? i18n.fmtNum(total, 0) : total, s: nSec }) : '';
}
$('buscar').addEventListener('input', buscar);
$('limpiar').addEventListener('click', () => { $('buscar').value = ''; buscar(); $('buscar').focus(); });

// ══════ Abrir una nave nueva: progreso por nave en este celular ══════
const NN_LS = 'guiaNaveNueva';      // { claveNave: { nombre, hechos: [paso…] } }
const NN_ULT = 'guiaNaveNuevaUlt';  // último nombre de nave escrito
const claveNave = n => norm(n).replace(/\s+/g, '');
let _nnMem = null;
function nnLeer() {
  if (_nnMem) return JSON.parse(JSON.stringify(_nnMem));
  try { const o = JSON.parse(localStorage.getItem(NN_LS) || '{}'); _nnMem = o && typeof o === 'object' ? o : {}; } catch (e) { _nnMem = {}; }
  return JSON.parse(JSON.stringify(_nnMem));
}
function nnGuardar(o) { _nnMem = o; try { localStorage.setItem(NN_LS, JSON.stringify(o)); } catch (e) {} }
function nnNave() { return ($('nnNave') && $('nnNave').value.trim()) || ''; }
function nnPintar() {
  const box = $('nnPasos'); if (!box) return;
  const k = claveNave(nnNave());
  const hechos = new Set(k ? ((nnLeer()[k] || {}).hechos || []) : []);
  const pasos = [...box.querySelectorAll('.paso')];
  pasos.forEach(p => { const c = p.querySelector('input'); c.checked = hechos.has(p.dataset.paso); c.disabled = !k; p.classList.toggle('hecho', c.checked); });
  const n = pasos.filter(p => p.querySelector('input').checked).length;
  $('nnBarra').style.width = (n / pasos.length * 100) + '%';
  const txt = $('nnTxt'); txt.textContent = k ? U('nnPasos', { n, t: pasos.length }) : U('nnEscribe');
  if (k && n === pasos.length) txt.insertAdjacentHTML('beforeend', ` · <span data-icon="check-circle" class="ic-ok"></span> ${escG(U('nnLista'))}`);
}
function nnIniciar(mantener) {
  const inp = $('nnNave'); if (!inp) return;
  if (!mantener) {
    let ult = '';
    try { ult = localStorage.getItem(NN_ULT) || ''; } catch (e) {}
    let activa = '';
    try { activa = (typeof fbNaveActiva === 'function' && fbNaveActiva()) || ''; } catch (e) {}
    inp.value = ult || activa || '';
  }
  try {
    const naves = typeof fbNavesDisponibles === 'function' ? fbNavesDisponibles() : [];
    $('nnNaves').innerHTML = naves.map(n => `<option value="${fbEsc(n)}"></option>`).join('');
  } catch (e) {}
  inp.addEventListener('input', () => { try { localStorage.setItem(NN_ULT, inp.value.trim()); } catch (e) {} nnPintar(); });
  $('nnPasos').addEventListener('change', e => {
    const c = e.target; if (!c.matches('input[type=checkbox]')) return;
    const nombre = nnNave(), k = claveNave(nombre); if (!k) return;
    const o = nnLeer();
    const reg = o[k] || { nombre, hechos: [] };
    const paso = c.closest('.paso').dataset.paso;
    reg.nombre = nombre;
    reg.hechos = (reg.hechos || []).filter(x => x !== paso);
    if (c.checked) reg.hechos.push(paso);
    o[k] = reg; nnGuardar(o);
    try { localStorage.setItem(NN_ULT, nombre); } catch (e) {}
    nnPintar();
  });
  // (v3 etapa 3b) Reversible: se desmarca ya y el aviso ofrece "Deshacer" (antes: confirm()).
  $('nnReset').addEventListener('click', () => {
    const nombre = nnNave(), k = claveNave(nombre); if (!k) return;
    const o = nnLeer(); const antes = o[k]; if (!antes) return;
    delete o[k]; nnGuardar(o); nnPintar();
    const deshacer = () => { const x = nnLeer(); x[k] = antes; nnGuardar(x); nnPintar(); };
    if (window.vtDeshacer) vtDeshacer(U('nnReset') + ' · ' + nombre, deshacer);
    else if (!confirm(U('nnConfirm', { n: nombre }))) deshacer();
  });
  nnPintar();
}

// ══════ Imprimir: todo abierto ══════
let _abiertasImp = null;
window.addEventListener('beforeprint', () => {
  const secs = [...document.querySelectorAll('#secciones > details.sec')];
  _abiertasImp = new Set(secs.filter(s => s.open).map(s => s.id));
  secs.forEach(s => { s.open = true; });
});
window.addEventListener('afterprint', () => {
  if (!_abiertasImp) return;
  document.querySelectorAll('#secciones > details.sec').forEach(s => { s.open = _abiertasImp.has(s.id); });
  _abiertasImp = null;
});
function imprimirGuia() { window.print(); }

// ══════ Arranque ══════
// Se pinta ya (sin esperar la sesión) y otra vez con el rol; cambia de idioma sin recargar.
pintarGuia();
window.addEventListener('idioma-cambiado', pintarGuia);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
window.fbReady.then(() => {
  const rol = (window.currentUserRole && window.currentUserRole.rol) || '';
  ROL = rol;
  $('secciones').innerHTML = '';
  pintarGuia();
  if (rol !== 'OPERADOR' && rol !== 'RRHH' && typeof fbRenderMiniNav === 'function') fbRenderMiniNav('guia');
  window.__guiaLista = true;
}).catch(() => { /* sin sesión: firebase-init ya mandó a login.html */ });
</script>
