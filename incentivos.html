  <style>
    /* ══════════════════════════════════════════════════════════════════
       INCENTIVOS POR CUMPLIMIENTO (20 oct 2026)
       Solo Administrador. Por semana ISO (lunes a domingo) y por técnico
       (tecnicos.json) se calcula un puntaje de 0 a 100 % con 4 criterios:
         1. Checklists a tiempo   2. OTs a tiempo
         3. Respuesta a avisos    4. Calidad (sin rechazos ni reincidencias)
       Monto = base semanal × puntaje (0 si no llega al mínimo) + ajuste.
       Base semanal = salario mensual × % de incentivo × 12 ÷ 52.
       Colecciones (solo Admin en firestore.rules):
         /incentivos_config/general       reglas y salarios
         /incentivos_semanas/{AAAA-Wss}    ajustes y semana aprobada (congelada)
       Plan gratis de Firebase: solo se consulta la semana que se ve, con
       consultas de un solo campo (sin listeners ni colecciones completas).
       Sin Firebase Storage.
       ══════════════════════════════════════════════════════════════════ */
    :root {
      --bg: var(--color-bg); --surface: var(--color-surface-2); --card: var(--color-surface);
      --accent: var(--color-accent); --green: var(--color-success); --red: var(--color-danger); --blue: var(--color-primary); --orange: var(--color-warn);
      --text: var(--color-text); --muted: var(--color-muted); --border: var(--color-border);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { overflow-x: hidden; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); min-height: 100vh; }
    #header { background: var(--color-header-bg); color: var(--color-header-text); border-bottom: 2px solid var(--accent); padding: 14px 16px; }
    #header h1 { font-size: 17px; font-weight: 800; }
    #header small { font-size: 11px; color: var(--color-header-sub); font-weight: 700; display: block; margin-top: 2px; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 12px 12px 60px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; min-width: 0; }
    .wk { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .wk button { background: var(--border); color: var(--text); border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 800; font-size: 16px; cursor: pointer; font-family: inherit; }
    .wk button[disabled] { opacity: .35; cursor: default; }
    .wk div { text-align: center; min-width: 0; }
    .wk b { font-size: 15px; } .wk span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
    .tot { display: flex; gap: 8px; margin-top: 12px; }
    .tot div { flex: 1; min-width: 0; background: var(--surface); border-radius: 10px; padding: 10px 6px; text-align: center; }
    .tot b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .tot span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .estado { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.7; }
    .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: #F59E0B22; color: var(--color-accent-text); }
    .tag.ok { background: #10B98122; color: var(--color-success-text); } .tag.info { background: #818CF822; color: var(--color-primary-text); } .tag.bad { background: #EF444422; color: var(--color-danger-text); }
    .nota { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
    .tec { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; cursor: pointer; min-width: 0; }
    .tec.amb { border-color: #F59E0B66; } .tec.roj { border-color: #EF444466; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .top b { font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
    .pct { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bar { height: 6px; background: var(--border); border-radius: 4px; margin: 8px 0; overflow: hidden; }
    .bar i { display: block; height: 100%; }
    .crit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 10px; font-size: 12px; color: var(--muted); }
    .crit b { color: var(--text); }
    .det { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.55; overflow-wrap: anywhere; }
    .det .m { color: var(--color-danger-text); display: block; } .det .i { color: var(--muted); display: block; }
    .adj { font-size: 12px; color: var(--color-primary-text); margin-top: 6px; overflow-wrap: anywhere; }
    .monto { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 13px; }
    .monto span { min-width: 0; } .monto b { font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .btn { width: 100%; padding: 13px; border-radius: 10px; border: 0; font-weight: 800; font-size: 15px; background: var(--color-primary); color: var(--color-on-primary); margin-top: 4px; cursor: pointer; font-family: inherit; }
    .btn2 { width: 100%; padding: 11px; border-radius: 10px; border: 0; font-weight: 700; font-size: 14px; background: var(--border); color: var(--text); margin-top: 8px; cursor: pointer; font-family: inherit; }
    .btn-sm { width: auto; padding: 9px 14px; font-size: 13.5px; margin-top: 0; }
    .btn-danger { background: #EF444422; color: var(--color-danger-text); border: 1px solid #EF444455; }
    .empty { text-align: center; color: var(--muted); padding: 26px 10px; font-size: 13.5px; line-height: 1.6; }
    input, textarea { width: 100%; background: var(--color-input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; color: var(--text); font-size: 15px; font-family: inherit; outline: none; min-width: 0; }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 64px; resize: vertical; }
    label.f { display: block; font-size: 10.5px; color: var(--color-accent-text); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin: 10px 0 5px; }
    .g2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 10px; }
    .sec { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 4px; }
    .ts { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
    .ts .g2 label.f { margin-top: 6px; }
    .formula { background: #F59E0B14; border: 1px solid #F59E0B44; border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.5; margin-top: 8px; }
    /* modal */
    .modal-bg { display: none; position: fixed; inset: 0; background: var(--color-overlay); z-index: 600; align-items: flex-start; justify-content: center; padding: 24px 10px; overflow-y: auto; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; width: 100%; max-width: 560px; min-width: 0; }
    .modal h3 { font-size: 16px; margin-bottom: 4px; overflow-wrap: anywhere; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; flex-wrap: wrap; }
    #toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 999; background: var(--green); color: #fff; border-radius: 10px; padding: 11px 18px; font-size: 14px; font-weight: 600; max-width: 360px; width: 90%; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
    #toast.show { opacity: 1; } #toast.error { background: var(--red); } #toast.warn { background: var(--color-warn); }
    /* ── Reporte para pago (26 oct 2026): pantalla con los colores de la app y la hoja en blanco (papel) ── */
    select { width: 100%; background: var(--color-input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 8px; color: var(--text); font-size: 15px; font-family: inherit; min-width: 0; max-width: 100%; }
    .rep-bg { display: none; position: fixed; inset: 0; z-index: 700; background: var(--color-bg); overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    .rep-bg.open { display: block; }
    html.rep-abierto, html.rep-abierto body { overflow: hidden; }
    .rep-bar { position: sticky; top: 0; z-index: 2; background: var(--color-header-bg); color: var(--color-header-text); border-bottom: 2px solid var(--accent); padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
    .rep-bar button { background: rgba(255,255,255,.14); color: var(--color-header-text); border: 0; border-radius: 8px; padding: 7px 13px; font-size: 18px; font-weight: 800; cursor: pointer; font-family: inherit; }
    .rep-bar .t { min-width: 0; flex: 1; } .rep-bar b { display: block; font-size: 15px; } .rep-bar small { display: block; font-size: 11px; color: var(--color-header-sub); font-weight: 700; overflow-wrap: anywhere; }
    .rep-in { max-width: 820px; margin: 0 auto; padding: 12px 12px 60px; min-width: 0; }
    .rep-acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
    .rep-acts .btn, .rep-acts .btn2 { margin-top: 0; padding: 11px 4px; font-size: 13.5px; }
    .rep-wrap { overflow: hidden; margin-bottom: 12px; border-radius: 6px; box-shadow: var(--shadow-lg); background: #fff; border: 1px solid var(--border); }
    .paper { width: 760px; transform-origin: top left; background: #fff; color: #000; color-scheme: light; font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; padding: 28px 30px 40px; font-size: 13px; line-height: 1.35; cursor: default; }
    .p-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; min-height: 72px; }
    .p-logo img { max-width: 220px; max-height: 72px; display: block; }
    .p-ph { font-weight: 900; font-size: 30px; letter-spacing: -.5px; color: #000; font-family: Arial, sans-serif; white-space: nowrap; } .p-ph i { font-style: normal; color: #C00000; }
    .p-tit { text-align: right; } .p-title { font-size: 30px; font-weight: 800; letter-spacing: .5px; } .p-fecha { font-weight: 700; margin-top: 6px; }
    .p-tab { width: 100%; border-collapse: collapse; margin-top: 8px; table-layout: fixed; }
    .p-tab td.nom { overflow-wrap: anywhere; }
    .p-tab th, .p-tab td { border: 1px solid #000; padding: 5px 6px; }
    .p-tab th { background: #FFFF00; font-weight: 700; text-align: center; font-size: 12px; }
    .p-tab td.c { text-align: center; } .p-tab td.m { text-align: right; white-space: nowrap; } .p-tab td.nom { background: #D9D9D9; }
    .p-tab tr[data-rid] { cursor: pointer; } .p-vacio { color: #666; }
    .p-mk { color: #C00000; font-style: normal; font-weight: 700; margin-left: 2px; }
    .p-total { display: flex; justify-content: flex-end; margin: 12px 0 20px; } .p-total span, .p-total b { border: 2px solid #000; padding: 6px 12px; font-weight: 700; }
    .p-total span { border-right: 0; min-width: 220px; text-align: center; } .p-total b { min-width: 130px; text-align: right; }
    .p-desc { margin-top: 18px; } .p-desc div { padding: 2px 0; }
    .p-firma { margin: 70px auto 0; width: 280px; text-align: center; font-weight: 700; } .p-linea { border-top: 1px solid #000; margin-bottom: 4px; }
    .rf { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-top: 10px; min-width: 0; }
    .rf-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; } .rf-top b { font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
    .rf-btns { display: flex; gap: 4px; flex-shrink: 0; } .rf-btns button { background: var(--border); color: var(--text); border: 0; border-radius: 7px; width: 32px; height: 30px; font-weight: 800; cursor: pointer; font-family: inherit; }
    .rf-btns button.del { background: var(--color-danger-soft); color: var(--color-danger-text); }
    .rf-g { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0 8px; } .rf-g > div { min-width: 0; }
    .rf-g .w1 { grid-column: span 2; } .rf-g .w2 { grid-column: span 3; } .rf-g .w3 { grid-column: span 4; }
    .rf-g label.f { margin: 8px 0 4px; } .rf-g input, .rf-g select { padding: 8px 8px; font-size: 14px; }
    .rf-mk { margin-top: 8px; font-size: 12px; line-height: 1.8; }
    .lnk { background: none; border: 0; color: var(--color-primary-text); font-weight: 800; cursor: pointer; font-size: 14px; font-family: inherit; }
    .rep-add { display: flex; gap: 8px; margin-top: 8px; } .rep-add input { flex: 1; } .rep-add .btn { flex-shrink: 0; }
    #repUsr, #repCargarUsr { margin-top: 8px; }
    .rep-logo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .rep-logo-v { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; min-height: 46px; display: flex; align-items: center; max-width: 100%; }
    .rep-logo-v img { max-height: 40px; max-width: 180px; display: block; } .rep-logo-v .p-ph { font-size: 18px; }
    .rep-file { position: relative; overflow: hidden; display: inline-block; width: auto; margin-top: 0; text-align: center; }
    .rep-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
    .rep-dlg { display: none; position: fixed; inset: 0; z-index: 800; background: var(--color-overlay); align-items: center; justify-content: center; padding: 16px; }
    .rep-dlg.open { display: flex; } .rep-dlg .modal { max-width: 380px; }
    @media print {
      @page { size: letter portrait; margin: 12mm; }
      html.rep-abierto body > *:not(#repBg) { display: none !important; }
      html.rep-abierto, html.rep-abierto body { overflow: visible !important; background: #fff !important; }
      #repBg { position: static !important; overflow: visible !important; background: #fff !important; }
      #repBg .rep-ui { display: none !important; }
      #repBg .rep-in { padding: 0 !important; max-width: none !important; }
      .rep-wrap { height: auto !important; box-shadow: none !important; overflow: visible !important; border: 0 !important; margin: 0 !important; }
      .paper { transform: none !important; width: auto !important; padding: 0 !important; }
      .p-mk { display: none !important; }
      .p-tab th, .p-tab td.nom { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<div id="header">
  <h1>💰 Incentivos por cumplimiento</h1>
  <small id="header-sub">Cargando...</small>
</div>

<!-- (25 oct 2026, Etapa 3) Filtro Nave → Área → Línea → Equipo: qué técnicos y trabajos se muestran -->
<div class="wrap" id="fUbicWrap" style="display:none;padding-bottom:0;"><div class="card" style="margin-bottom:0;padding:10px;"><div id="fUbic"></div></div></div>
<div class="wrap" id="view"><div class="card empty">Cargando...</div></div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<!-- (26 oct 2026) Reporte para pago: pantalla completa con la hoja (papel) y lo que se edita -->
<div id="repBg" class="rep-bg">
  <div class="rep-bar rep-ui"><button id="repCerrar" aria-label="Volver a incentivos">←</button><div class="t"><b>📄 Reporte para pago</b><small id="repTit"></small></div></div>
  <div class="rep-in">
    <div class="rep-ui" id="repEstado" style="margin-bottom:8px"></div>
    <div class="rep-acts rep-ui"><button class="btn" id="repGuardar">💾 Guardar reporte</button><button class="btn2" id="repXls">⬇️ Excel</button><button class="btn2" id="repPdf">🖨 PDF / Imprimir</button></div>
    <div class="rep-wrap" id="repWrap"><div class="paper" id="repPaper"></div></div>
    <div class="nota rep-ui" style="margin:-4px 2px 12px">Toca una fila de la hoja para cambiarla. <b style="color:#C00000">*</b> = monto u horas puestos a mano (no sale al imprimir).</div>
    <div class="rep-ui" id="repEd"></div>
  </div>
</div>
<div id="repCsvDlg" class="rep-dlg"><div class="modal" role="dialog" aria-modal="true"><h3>📵 Excel no disponible</h3><div class="nota" id="repCsvMsg"></div>
  <div class="modal-actions"><button class="btn2 btn-sm" id="repCsvNo">Cerrar</button><button class="btn btn-sm" id="repCsvOk">⬇️ Descargar CSV</button></div></div></div>

<script>
// ══════ AYUDAS ══════
const esc = s => fbEsc(s);
const $ = id => document.getElementById(id);
const K = s => fbEquipoKey(s);
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const money = n => { n = r2(n); return 'RD$ ' + n.toLocaleString('es-DO', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
const signo = n => (n > 0 ? '+' : n < 0 ? '−' : '') + money(Math.abs(n));
const pctTxt = v => v == null ? '—' : Math.round(v * 100) + '%';
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const ddmm = f => { const d = fbParseFecha(f); return d ? String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') : '—'; };
const ddmmaa = f => { const d = fbParseFecha(f); return d ? ddmm(f) + '/' + d.getFullYear() : '—'; };
const sumarDias = (f, n) => { const d = fbParseFecha(f); d.setDate(d.getDate() + n); return fbFechaLocal(d); };
const diasEntre = (a, b) => Math.round((fbParseFecha(b) - fbParseFecha(a)) / 86400000);
const tsFecha = t => (t && typeof t.toDate === 'function') ? fbFechaLocal(t.toDate()) : null;
const tsMs = t => (t && typeof t.toMillis === 'function') ? t.toMillis() : null;
const tsHora = t => { if (!t || typeof t.toDate !== 'function') return null; const d = t.toDate(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const quien = () => (window.currentUserRole && window.currentUserRole.nombre) || (window.currentUser && window.currentUser.email) || '';
const uidYo = () => (window.currentUser && window.currentUser.uid) || '';

let _toastT = null;
function toast(msg, tipo) { const t = $('toast'); t.textContent = msg; t.className = 'show' + (tipo ? ' ' + tipo : ''); clearTimeout(_toastT); _toastT = setTimeout(() => t.className = '', 3200); }
function openModal(html) { $('modal').innerHTML = html; $('modalBg').classList.add('open'); }
function closeModal() { $('modalBg').classList.remove('open'); }
$('modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });
const fail = e => { console.error(e); toast('❌ ' + (e && e.code === 'permission-denied' ? 'Sin permiso: solo el Administrador puede guardar incentivos (revisa las reglas de Firebase).' : (e && e.message) || 'Error'), 'error'); };

// Escritura sin bloquear: sin señal, Firestore la guarda en el celular y la
// sube sola al volver; la pantalla no espera (mismo patrón que Checklist).
function escribir(promesa, msgOk, alFallar) {
  let listo = false, avisado = false;
  promesa.then(() => { listo = true; if (avisado) toast('☁️ Incentivos subidos al servidor ✅'); })
    .catch(e => { listo = true; fail(e); if (alFallar) alFallar(e); });
  if (!navigator.onLine) { avisado = true; toast(msgOk + ' 📵 Se subirá cuando haya señal.', 'warn'); }
  else { toast(msgOk); setTimeout(() => { if (!listo) { avisado = true; toast(msgOk + ' Se subirá cuando haya señal.', 'warn'); } }, 3000); }
}

// ══════ SEMANA ISO ══════
// Lunes (Date local) de la semana de una fecha.
function lunesDe(d) { d = new Date(d.getFullYear(), d.getMonth(), d.getDate()); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
function idSemana(lunes) { return fbAnioSemanaISO(lunes) + '-W' + String(fbSemanaISO(lunes)).padStart(2, '0'); }
function lunesDeId(id) {
  const m = /^(\d{4})-W(\d{1,2})$/.exec(id || ''); if (!m) return null;
  const l1 = lunesDe(new Date(+m[1], 0, 4)); l1.setDate(l1.getDate() + (+m[2] - 1) * 7);
  return idSemana(l1) === id ? l1 : null;
}
function rangoTxt(lunes) {
  const dom = new Date(lunes); dom.setDate(dom.getDate() + 6);
  const mesL = lunes.getMonth() !== dom.getMonth() ? ' ' + MESES[lunes.getMonth()] : '';
  return `lun ${lunes.getDate()}${mesL} – dom ${dom.getDate()} ${MESES[dom.getMonth()]} ${dom.getFullYear()}`;
}

// ══════ REGLAS (valores por defecto) ══════
const CRITERIOS = [
  { k: 'checklists', icono: '✅', nombre: 'Checklists a tiempo', vacio: 'sin checklists' },
  { k: 'ots', icono: '🧾', nombre: 'OTs a tiempo', vacio: 'sin OTs' },
  { k: 'avisos', icono: '🚨', nombre: 'Respuesta avisos', vacio: 'sin avisos' },
  { k: 'calidad', icono: '🛠', nombre: 'Calidad', vacio: 'sin trabajos' },
];
const CFG_DEF = { pesos: { checklists: 25, ots: 25, avisos: 25, calidad: 25 }, minimo: 70, pctDefault: 10, metaParadaMin: 15, metaFallaMin: 30, diasReincidencia: 15, tecnicos: {} };
function normCfg(d) {
  d = d || {};

  CRITERIOS.forEach(x => { const v = Number(d.pesos && d.pesos[x.k]); if (d.pesos && isFinite(v) && v >= 0) c.pesos[x.k] = v; });
  ['minimo', 'pctDefault', 'metaParadaMin', 'metaFallaMin', 'diasReincidencia'].forEach(k => { const v = Number(d[k]); if (d[k] != null && isFinite(v) && v >= 0) c[k] = v; });
  c.tecnicos = (d.tecnicos && typeof d.tecnicos === 'object') ? d.tecnicos : {};

}

// ══════ TÉCNICOS Y EMPAREJAMIENTO DE NOMBRES ══════
// Las OTs guardan el nombre de distintas formas: Bitácora pone los nombres
// completos de tecnicos.json separados por coma ("FELIX M. GIL #777, LEBRON"),
// Checklist pone el nombre completo en asignadoA/tecnicos, y
// trabajoRealizadoPor / cerradoPor llevan el nombre del USUARIO (puede ser
// "Felix Gil"). Un texto es de un técnico si (sin acentos, mayúsculas ni
// espacios) contiene su nombre o su nombre corto, o trae el mismo "#777";
// si una parte del texto no coincide con nadie, se prueba con el primer
// nombre cuando solo un técnico lo tiene (igual que la Bitácora).
let TECS = [];
const tecKey = nombre => K(nombre).replace(/[^a-z0-9]/g, '_');
function prepararTecnicos(lista) {
  // (26 oct 2026) Red de seguridad: la misma persona (misma clave) sale UNA sola
  // vez aunque la lista la traiga repetida; sus naves se juntan (sin naves = todas).
  const porKey = new Map();
  (lista || []).filter(t => t && t.nombre).forEach(t => {
    const key = tecKey(t.nombre), pl = Array.isArray(t.plantas) ? t.plantas.slice() : [];
    const ya = porKey.get(key);
    if (ya) {
      if (!ya.plantas.length || !pl.length) ya.plantas = []; else pl.forEach(p => { if (!ya.plantas.includes(p)) ya.plantas.push(p); });
      if (!ya.nombreCompleto && t.nombreCompleto) ya.nombreCompleto = String(t.nombreCompleto);
      return;
    }
    const num = ((String(t.nombre) + ' ' + String(t.corto || '')).match(/#\s*(\d+)/) || [])[1] || '';
    porKey.set(key, { nombre: String(t.nombre), corto: String(t.corto || t.nombre), key, kN: K(t.nombre), kC: K(t.corto || ''), num, primero: K(String(t.nombre).trim().split(/\s+/)[0]), plantas: pl, nombreCompleto: t.nombreCompleto ? String(t.nombreCompleto) : '' });
  });
  TECS = [...porKey.values()];
}
function _coincideDirecto(t, k, nums) {
  if (t.kN && (k === t.kN || (t.kN.length >= 4 && k.includes(t.kN)))) return true;
  if (t.kC && (k === t.kC || (t.kC.length >= 4 && k.includes(t.kC)))) return true;
  return !!(t.num && nums.includes(t.num));
}
// Devuelve las claves (tecKey) de los técnicos nombrados en el texto.
function tecsEn(texto) {
  if (texto == null || texto === '') return [];
  if (Array.isArray(texto)) return [...new Set(texto.flatMap(tecsEn))];
  const s = String(texto), out = new Set();
  s.split(/[,;\/&+]|\s+y\s+/i).map(x => x.trim()).filter(Boolean).forEach(seg => {
    const k = K(seg), nums = [...seg.matchAll(/#\s*(\d+)/g)].map(m => m[1]);
    const hits = TECS.filter(t => _coincideDirecto(t, k, nums));
    if (hits.length) { hits.forEach(t => out.add(t.key)); return; }
    const pri = K(seg.split(/\s+/)[0]);
    const cands = TECS.filter(t => t.primero && t.primero === pri);
    if (cands.length === 1) out.add(cands[0].key);
  });
  return [...out];
}

// ══════ ESTADO ══════

// ══════ LECTURA DE UNA SEMANA (pocas lecturas) ══════
// 1 documento /incentivos_semanas/{id}. Si la semana está aprobada se muestra
// su copia y NO se lee nada más. Si no, 5 consultas de un solo campo:
//   checklists.fecha en la semana              (criterio 1)
//   ots.fechaPlanificada en la semana          (criterio 2)
//   ots.fechaReporte en la semana              (criterio 3)
//   ots.FECHA de lunes a domingo + días de reincidencia (criterio 4)
//   ots.trabajoRealizadoEn en la semana        (criterio 4, OTs de checklist)
async function cargarSemana(fresco) {
  const id = SEM, lunes = fbFechaLocal(LUNES), domingo = sumarDias(lunes, 6);
  if (!fresco && _cacheSemana.has(id)) { DATOS = _cacheSemana.get(id); render(); return; }
  cargando = true;
  $('view').innerHTML = cabeceraHtml(null) + '<div class="card empty">Calculando la semana...</div>';
  bindCabecera();
  try {
    const sd = await db.collection('incentivos_semanas').doc(id).get();
    const semDoc = sd.exists ? sd.data() : null;
    const datos = { id, lunes, domingo, semDoc, ck: [], otPlan: [], otRep: [], otFecha: [], otReal: [] };
    if (!semDoc || semDoc.estado !== 'aprobada') await leerDatosSemana(datos);
    if (SEM !== id) return; // cambió de semana mientras leía
    _cacheSemana.set(id, datos);
    DATOS = datos;
    render();
  } catch (e) {
    console.error(e);
    if (SEM === id) {
      $('view').innerHTML = cabeceraHtml(null) + `<div class="card empty">⚠️ No se pudieron leer los datos de la semana (${esc(e.code || e.message)}).<br><button class="btn2 btn-sm" id="bRe">🔄 Reintentar</button></div>`;
      bindCabecera(); $('bRe').onclick = () => cargarSemana(true);
    }
  } finally { cargando = false; }
}
async function leerDatosSemana(d) {
  const ots = db.collection('ots');
  const hasta = sumarDias(d.domingo, Math.max(0, Math.round(CFG.diasReincidencia)));
  const T = firebase.firestore.Timestamp;
  const desdeTs = T.fromDate(fbParseFecha(d.lunes)), hastaTs = T.fromDate(fbParseFecha(sumarDias(d.domingo, 1)));
  const docs = s => s.docs.map(x => ({ id: x.id, ...x.data() }));
  const [ck, plan, rep, fec, real] = await Promise.all([
    db.collection('checklists').where('fecha', '>=', d.lunes).where('fecha', '<=', d.domingo).get(),
    ots.where('fechaPlanificada', '>=', d.lunes).where('fechaPlanificada', '<=', d.domingo).get(),
    ots.where('fechaReporte', '>=', d.lunes).where('fechaReporte', '<=', d.domingo).get(),
    ots.where('FECHA', '>=', d.lunes).where('FECHA', '<=', hasta).get(),
    ots.where('trabajoRealizadoEn', '>=', desdeTs).where('trabajoRealizadoEn', '<', hastaTs).get(),
  ]);
  d.ck = docs(ck); d.otPlan = docs(plan); d.otRep = docs(rep); d.otFecha = docs(fec); d.otReal = docs(real);
  d.lecturas = d.ck.length + d.otPlan.length + d.otRep.length + d.otFecha.length + d.otReal.length;
}

// ══════ CÁLCULO ══════
const equipoDe = o => o.EQUIPO || o.equipoNombre || o.TIPO_MAQUINA || '—';
const folioDe = o => o.folio || o.Title || o.id;
const anulada = o => o.estado === 'anulada';
// (20 oct 2026) Un proyecto / mejora de producción no es un aviso de falla:
// no cuenta en "Respuesta a avisos" ni en reincidencias (no afecta la
// eficiencia del técnico ni la de la máquina). Sí cuenta en "OTs a tiempo".
const esProyecto = o => o.tipoReporte === 'proyecto' || String(o.TIPO_MANTENIMIENTO || '').toLowerCase() === 'proyecto';
const esAviso = o => ['operador', 'qr'].includes(o.origen) && o.tipoReporte !== 'proyecto';
// Desde el 20 oct 2026 el trabajo planificado se reporta en la Bitácora; lo
// planificado antes de esa fecha se sigue contando como antes.
const CORTE_BITACORA = '2026-10-20';
function mismoEquipo(a, b) {
  if (a.equipoId && b.equipoId) return a.equipoId === b.equipoId;
  const ka = K(a.EQUIPO || a.equipoNombre), kb = K(b.EQUIPO || b.equipoNombre);
  return !!ka && ka === kb;
}
// Minutos de respuesta de un aviso (null si no se puede saber).
function minutosRespuesta(o) {
  const at = tsMs(o.atendidoEn), cr = tsMs(o.createdAt);
  if (at != null && cr != null) return Math.max(0, Math.round((at - cr) / 60000));
  const llegada = o.horaLlegada || o.H_TECNICO;
  const inicio = o.horaParada || tsHora(o.createdAt) || o.H_INICIO;
  if (fbHoraAMin(llegada) != null && fbHoraAMin(inicio) != null) return fbMinutosEntre(inicio, llegada);
  return null;
}
function calcular(d) {
  const c = CFG, hoy = fbHoy();
  const R = {}; TECS.forEach(t => { R[t.key] = { checklists: { ok: 0, n: 0 }, ots: { ok: 0, n: 0 }, avisos: { ok: 0, n: 0 }, calidad: { ok: 0, n: 0 }, bajo: [], info: [] }; });
  const marca = (keys, crit, bien, txtMal, txtInfo) => keys.forEach(k => { const r = R[k]; if (!r) return; r[crit].n++; if (bien) r[crit].ok++; else r.bajo.push(txtMal); if (txtInfo) r.info.push(txtInfo); });

  // 1) Checklists a tiempo
  d.ck.filter(x => x.fecha >= d.lunes && x.fecha <= d.domingo).forEach(x => {
    const keys = tecsEn([].concat(x.tecnicos || [], x.tecnico || []));
    let bien, info = null;
    if (typeof x.aTiempo === 'boolean') bien = x.aTiempo;
    else if (x.vencimiento) bien = x.fecha <= x.vencimiento;
    else { bien = true; info = `Checklist ${equipoDe(x)} del ${ddmm(x.fecha)} (sin fecha de vencimiento): contado a tiempo`; }
    marca(keys, 'checklists', bien, `Checklist ${equipoDe(x)} del ${ddmm(x.fecha)}: tocaba el ${ddmm(x.vencimiento)}`, info);
  });

  // 2) OTs a tiempo (planificadas para esta semana): OTs de checklist y
  // proyectos. (20 oct 2026) Cuenta como hecha solo si el técnico la reportó
  // en la Bitácora (reportadoEnBitacora) y a tiempo = reportada a más tardar
  // el día planificado. Cerrada sin reporte = "no reportada en Bitácora".
  d.otPlan.filter(o => !anulada(o) && o.fechaPlanificada >= d.lunes && o.fechaPlanificada <= d.domingo).forEach(o => {
    const keys = tecsEn(o.asignadoA);
    if (!keys.length) return;
    const nueva = o.fechaPlanificada >= CORTE_BITACORA;
    if (nueva && !o.reportadoEnBitacora && ['en_revision', 'validada', 'completada'].includes(o.estado)) {
      marca(keys, 'ots', false, `${folioDe(o)} ${equipoDe(o)}: planificada el ${ddmm(o.fechaPlanificada)}, no reportada en Bitácora`);
      return;
    }
    const hecha = ['en_revision', 'validada', 'completada'].includes(o.estado) && (!nueva || !!o.reportadoEnBitacora);
    const fHecha = hecha ? (tsFecha(o.trabajoRealizadoEn) || o.FECHA || o.fechaCompletada || null) : null;
    if (!hecha || !fHecha) {
      if (hoy <= o.fechaPlanificada) return; // todavía está a tiempo: no cuenta aún
      marca(keys, 'ots', false, `${folioDe(o)} ${equipoDe(o)}: planificada el ${ddmm(o.fechaPlanificada)}, ${o.estado === 'rechazada' ? 'devuelta en revisión, todavía sin terminar' : nueva ? 'no reportada en Bitácora' : 'todavía sin terminar'}`);
      return;
    }
    marca(keys, 'ots', fHecha <= o.fechaPlanificada, `${folioDe(o)} ${equipoDe(o)}: planificada el ${ddmm(o.fechaPlanificada)}, ${nueva ? 'reportada en Bitácora' : 'terminada'} el ${ddmm(fHecha)}`);
  });

  // 3) Respuesta a avisos de producción / QR
  d.otRep.filter(o => esAviso(o) && !anulada(o) && o.fechaReporte >= d.lunes && o.fechaReporte <= d.domingo).forEach(o => {
    let keys = tecsEn(o.asignadoA);
    if (!keys.length && o.estado === 'completada') keys = tecsEn(o.TECNICOS);
    if (!keys.length) return; // nadie lo tomó: no cuenta para nadie
    const min = minutosRespuesta(o);
    if (min == null) return;
    const meta = o.maquinaParada ? c.metaParadaMin : c.metaFallaMin;
    marca(keys, 'avisos', min <= meta, `Aviso ${folioDe(o)} ${equipoDe(o)}: llegó en ${min} min (meta ${meta} min, ${o.maquinaParada ? 'máquina parada' : 'falla'})`);
  });

  // 4) Calidad: rechazos en revisión y reincidencias
  const trabajos = new Map(); // id → { o, keys }
  const agrega = (o, keys) => { if (!keys.length) return; const t = trabajos.get(o.id); if (t) keys.forEach(k => { if (!t.keys.includes(k)) t.keys.push(k); }); else trabajos.set(o.id, { o, keys: keys.slice() }); };
  const realizado = o => !anulada(o) && !(['operador', 'qr', 'checklist'].includes(o.origen) && o.estado !== 'completada');
  d.otFecha.filter(o => o.FECHA >= d.lunes && o.FECHA <= d.domingo && realizado(o)).forEach(o => agrega(o, tecsEn(o.TECNICOS)));
  d.otReal.filter(o => !anulada(o)).forEach(o => { const f = tsFecha(o.trabajoRealizadoEn); if (!f || f < d.lunes || f > d.domingo) return; let k = tecsEn(o.trabajoRealizadoPor); if (!k.length) k = tecsEn(o.asignadoA); agrega(o, k); });
  const posteriores = d.otFecha.filter(o => o.FECHA && !anulada(o) && realizado(o) && !esProyecto(o) && String(o.TIPO_MANTENIMIENTO || '').toLowerCase() === 'correctivo');
  const dias = Math.max(0, Math.round(c.diasReincidencia));
  trabajos.forEach(({ o, keys }) => {
    const fecha = o.FECHA || tsFecha(o.trabajoRealizadoEn);
    const rech = (Number(o.vecesRechazada) || 0) || (o.revisionResultado === 'rechazada' || o.estado === 'rechazada' ? 1 : 0);
    if (rech) { marca(keys, 'calidad', false, `${folioDe(o)} ${equipoDe(o)}: rechazada en revisión${rech > 1 ? ' (' + rech + ' veces)' : ''}`); return; }
    // (20 oct 2026) Un proyecto no es una reparación: no se le buscan reincidencias.
    if (esProyecto(o)) { marca(keys, 'calidad', true); return; }
    const causa = K(o.CAUSA_FALLA || o.causaFalla);
    let vuelta = null;
    if (causa && fecha) {
      const limite = sumarDias(fecha, dias);
      vuelta = posteriores.filter(p => p.id !== o.id && mismoEquipo(o, p) && K(p.CAUSA_FALLA || p.causaFalla) === causa
        && p.FECHA <= limite && (p.FECHA > fecha || (p.FECHA === fecha && fbHoraAMin(p.H_INICIO) != null && fbHoraAMin(o.H_INICIO) != null && fbHoraAMin(p.H_INICIO) > fbHoraAMin(o.H_INICIO))))
        .sort((a, b) => a.FECHA.localeCompare(b.FECHA))[0] || null;
    }
    if (vuelta) {
      const n = diasEntre(fecha, vuelta.FECHA);
      marca(keys, 'calidad', false, `${equipoDe(o)}: volvió a fallar por "${o.CAUSA_FALLA || o.causaFalla}" ${n ? n + (n === 1 ? ' día' : ' días') + ' después de' : 'el mismo día de'} su reparación (${folioDe(o)} → ${folioDe(vuelta)})`);
    } else marca(keys, 'calidad', true);
  });

  // Puntaje y monto por técnico
  const filas = TECS.map(t => {
    const r = R[t.key], cfgT = c.tecnicos[t.key] || {};
    const criterios = {};
    let sw = 0, sv = 0;
    CRITERIOS.forEach(x => {
      const v = r[x.k].n ? r[x.k].ok / r[x.k].n : null;
      criterios[x.k] = { ok: r[x.k].ok, n: r[x.k].n, v };
      const w = Number(c.pesos[x.k]) || 0;
      if (v != null && w > 0) { sw += w; sv += w * v; }
    });
    const sinDatos = sw === 0;
    const puntaje = sinDatos ? null : Math.round(sv / sw * 100);
    const salario = Number(cfgT.salario) || 0;
    const pct = (cfgT.pct != null && cfgT.pct !== '' && isFinite(Number(cfgT.pct))) ? Number(cfgT.pct) : c.pctDefault;
    const base = r2(salario * pct / 100 * 12 / 52);
    const cobra = !sinDatos && puntaje >= c.minimo;
    const montoCalc = cobra ? r2(base * puntaje / 100) : 0;
    const aj = ((d.semDoc && d.semDoc.ajustes) || {})[t.key] || {};
    const ajuste = r2(aj.monto);
    const monto = r2(Math.max(0, montoCalc + ajuste));
    return { key: t.key, nombre: t.nombre, criterios, puntaje, sinDatos, cobra, base, pct, salarioOk: salario > 0, montoCalc, ajuste, motivo: aj.motivo || '', monto, bajo: r.bajo, info: r.info };
  });
  const conDatos = filas.filter(f => !f.sinDatos);
  return {
    filas,
    promedio: conDatos.length ? Math.round(conDatos.reduce((s, f) => s + f.puntaje, 0) / conDatos.length) : null,
    total: r2(filas.reduce((s, f) => s + f.monto, 0)),
    calidadDefinitiva: sumarDias(d.domingo, dias),
  };
}
// La semana como se muestra: congelada (aprobada) o calculada ahora.
function semanaVista() {
  const sd = DATOS.semDoc;
  if (sd && sd.estado === 'aprobada' && Array.isArray(sd.tecnicos)) {
    const filas = sd.tecnicos.map(f => ({ ...f, bajo: f.bajo || [], info: f.info || [], criterios: f.criterios || {} }));
    const cd = filas.filter(f => !f.sinDatos);
    return { congelada: true, filas, promedio: sd.promedio != null ? sd.promedio : (cd.length ? Math.round(cd.reduce((s, f) => s + f.puntaje, 0) / cd.length) : null), total: sd.totalPagar != null ? sd.totalPagar : r2(filas.reduce((s, f) => s + f.monto, 0)), minimo: (sd.reglas || {}).minimo, calidadDefinitiva: sd.calidadDefinitiva };
  }
  return { congelada: false, minimo: CFG.minimo, ...calcular(DATOS) };
}

    if (sd.reabiertaPor) h += `<div class="nota">Reabierta por ${esc(sd.reabiertaPor)}${sd.reabiertaEn ? ' el ' + esc(fechaTs(sd.reabiertaEn)) : ''}.</div>`;
    if (fbFechaLocal(LUNES) <= fbHoy() && fbHoy() <= DATOS.domingo) h += '<div class="nota">⏳ La semana todavía no termina: los números pueden cambiar.</div>';
  }
  if (v.calidadDefinitiva && v.calidadDefinitiva > fbHoy() && !v.congelada) h += `<div class="nota">🛠 Calidad definitiva el ${esc(ddmmaa(v.calidadDefinitiva))} (se revisa si la máquina vuelve a fallar por la misma causa en ${esc(CFG.diasReincidencia)} días).</div>`;
  return h;
}
function bindCabecera() {

}
const colorPct = (p, min) => p == null ? 'var(--muted)' : p >= 90 ? 'var(--green)' : p >= min ? 'var(--accent)' : 'var(--red)';
function tarjetaHtml(f, v) {
  const min = v.minimo != null ? v.minimo : CFG.minimo;

  const MAXD = 8;

  const info = f.info.length ? `<div class="det">${f.info.slice(0, 4).map(t => `<span class="i">ℹ️ ${esc(t)}</span>`).join('')}${f.info.length > 4 ? `<span class="i">… y ${f.info.length - 4} más</span>` : ''}</div>` : '';
  const enF = f.enFiltro ? `<div class="det">📍 En el filtro (${f.enFiltro.length}): ${esc(f.enFiltro.slice(0, 6).join(' · '))}${f.enFiltro.length > 6 ? ' …' : ''}</div>` : '';
  const adj = f.ajuste ? `<div class="adj">✏️ Ajuste ${esc(signo(f.ajuste))} · "${esc(f.motivo)}"</div>` : '';
  let pie;
  if (f.sinDatos) pie = `<span>Sin trabajos esta semana</span><b>${money(f.monto)}</b>`;
  else if (!f.cobra) pie = `<span>Menos de ${esc(min)}%: no cobra esta semana${f.ajuste ? ' (+ ajuste)' : ''}</span><b>${money(f.monto)}</b>`;
  else pie = `<span>Base ${money(f.base)} × ${f.puntaje}%${f.ajuste ? ' + ajuste' : ''}</span><b>${money(f.monto)}</b>`;
  const sinSal = f.salarioOk === false ? '<div class="nota"><span class="tag bad">Sin salario configurado</span> Ponlo en ⚙️ Reglas y salarios.</div>' : '';
  return `<div class="tec${cls}" data-tec="${esc(f.key)}">
    <div class="top"><b>${esc(f.nombre)}</b><span class="pct" style="color:${col}">${f.sinDatos ? '—' : f.puntaje + '%'}</span></div>
    <div class="bar"><i style="width:${f.sinDatos ? 0 : Math.max(0, Math.min(100, f.puntaje))}%;background:${col}"></i></div>
    <div class="crit">${crit}</div>

// (25 oct 2026, Etapa 2) Con una nave elegida arriba se muestran solo sus
// técnicos (sin naves asignadas = de todas). El cálculo de cada técnico NO
// cambia (cuenta todo su trabajo); "Todas" = exactamente lo de antes. Aprobar
// la semana siempre guarda a TODOS los técnicos.
function vistaDeNave(v) {
  if (!fbNavesFiltro()) return v;
  const plantasDe = key => { const t = TECS.find(x => x.key === key); return t ? t.plantas : []; };
  const filas = v.filas.filter(f => fbTecnicoEnNave({ plantas: plantasDe(f.key) }));
  const cd = filas.filter(f => !f.sinDatos);
  return { ...v, filas, promedio: cd.length ? Math.round(cd.reduce((s, f) => s + f.puntaje, 0) / cd.length) : null, total: r2(filas.reduce((s, f) => s + f.monto, 0)), parcial: filas.length !== v.filas.length };
}
// (25 oct 2026, Etapa 3) Filtro de área / línea / equipo: se muestran solo los
// técnicos con trabajo de la semana en ese filtro (checklists, OTs planificadas,
// avisos y trabajos realizados, ya leídos: sin lecturas extra) y, en cada
// tarjeta, cuáles fueron. Su puntaje y monto NO cambian (son de toda su semana).
// Una semana aprobada no guarda las OTs: ahí el filtro de área no se aplica.
let ubic = null;
function trabajosEnUbic(d) {
  const m = new Map();
  const add = (keys, t) => keys.forEach(k => { if (!m.has(k)) m.set(k, []); if (!m.get(k).includes(t)) m.get(k).push(t); });
  const en = o => ubic.coincide(o);
  const sem = f => f >= d.lunes && f <= d.domingo;
  d.ck.filter(x => sem(x.fecha) && en(x)).forEach(x => add(tecsEn([].concat(x.tecnicos || [], x.tecnico || [])), 'Checklist ' + equipoDe(x) + ' ' + ddmm(x.fecha)));
  d.otPlan.filter(o => !anulada(o) && sem(o.fechaPlanificada) && en(o)).forEach(o => add(tecsEn(o.asignadoA), folioDe(o) + ' ' + equipoDe(o)));
  d.otRep.filter(o => esAviso(o) && !anulada(o) && sem(o.fechaReporte) && en(o)).forEach(o => { let k = tecsEn(o.asignadoA); if (!k.length && o.estado === 'completada') k = tecsEn(o.TECNICOS); add(k, folioDe(o) + ' ' + equipoDe(o)); });
  d.otFecha.filter(o => sem(o.FECHA) && !anulada(o) && en(o)).forEach(o => add(tecsEn(o.TECNICOS), folioDe(o) + ' ' + equipoDe(o)));
  d.otReal.filter(o => !anulada(o) && en(o)).forEach(o => { const f = tsFecha(o.trabajoRealizadoEn); if (!f || !sem(f)) return; let k = tecsEn(o.trabajoRealizadoPor); if (!k.length) k = tecsEn(o.asignadoA); add(k, folioDe(o) + ' ' + equipoDe(o)); });
  return m;
}
function vistaDeUbic(v) {
  if (!ubic || !ubic.activo()) return v;
  if (v.congelada) return { ...v, ubicNoAplica: true };
  const m = trabajosEnUbic(DATOS);
  const filas = v.filas.filter(f => m.has(f.key)).map(f => ({ ...f, enFiltro: m.get(f.key) }));
  const cd = filas.filter(f => !f.sinDatos);
  return { ...v, filas, promedio: cd.length ? Math.round(cd.reduce((s, f) => s + f.puntaje, 0) / cd.length) : null, total: r2(filas.reduce((s, f) => s + f.monto, 0)), parcial: true };
}
function render() {
  if (!DATOS || DATOS.id !== SEM) return;
  const vTodas = semanaVista();
  const v = vistaDeUbic(vistaDeNave(vTodas));
  window.__inc = { semana: SEM, vista: v, vistaTodas: vTodas }; // (para las pruebas automáticas)
  const hoyL = lunesDe(new Date());
  const terminada = DATOS.domingo < fbHoy();
  const esActual = fbFechaLocal(LUNES) === fbFechaLocal(hoyL);
  const sd = DATOS.semDoc || {};
  let botones = '';
  if (!v.congelada && (terminada || esActual)) botones += `<button class="btn" id="bAprobar">✅ Aprobar semana ${fbSemanaISO(LUNES)}</button>`;
  if (v.congelada) {
    botones += sd.pagada ? `<button class="btn2" id="bPagada">↩ Quitar marca de pagada</button>` : `<button class="btn" id="bPagada">💵 Marcar como pagada</button><button class="btn2 btn-danger" id="bReabrir">🔓 Reabrir semana</button>`;
  }
  botones += `<button class="btn2" id="bReporte">📄 Reporte para pago</button><button class="btn2" id="bExcel">⬇️ Descargar Excel</button><button class="btn2" id="bReglas">⚙️ Reglas y salarios</button>`;
  const notaCk = v.filas.some(f => f.info.length) ? '<div class="nota" style="margin:0 2px 10px">ℹ️ Los checklists guardados antes del 20 oct 2026 no tienen fecha de vencimiento y se cuentan a tiempo. Desde ahora este criterio es exacto.</div>' : '';
  $('view').innerHTML = cabeceraHtml(v)
    + (v.filas.length ? v.filas.map(f => tarjetaHtml(f, v)).join('') : '<div class="card empty">No hay técnicos en la lista (⚙️ Administración → Usuarios).</div>')
    + notaCk + (v.parcial ? `<div class="nota" style="margin:0 2px 10px">🏭 Mostrando los técnicos ${ubic && ubic.activo() ? 'con trabajo en ' + esc(ubic.texto()) : 'de ' + esc(fbNaveTexto())} (${v.filas.length} de ${vTodas.filas.length}). Su puntaje y monto son de toda su semana. Aprobar guarda la semana de todos (${esc(money(vTodas.total))}).</div>` : '')
    + (v.ubicNoAplica ? '<div class="nota" style="margin:0 2px 10px">📍 Semana aprobada: se guardó sin el detalle de las OTs, así que el filtro de área / línea / equipo no se aplica (solo el de nave).</div>' : '') + botones
    + `<div class="nota" style="text-align:center;margin-top:12px">${v.congelada ? 'Toca un técnico para ver su detalle.' : 'Toca un técnico para poner un ajuste (+/− RD$).'} Pesos: ${CRITERIOS.map(x => esc(x.nombre) + ' ' + esc((v.congelada && (sd.reglas || {}).pesos ? sd.reglas.pesos : CFG.pesos)[x.k]) + '%').join(' · ')}.</div>`;
  bindCabecera();
  $('view').querySelectorAll('[data-tec]').forEach(el => el.onclick = () => modalAjuste(el.dataset.tec, v));
  if ($('bAprobar')) $('bAprobar').onclick = () => modalAprobar(vTodas, esActual); // siempre todos los técnicos
  if ($('bReabrir')) $('bReabrir').onclick = () => modalReabrir();
  if ($('bPagada')) $('bPagada').onclick = () => marcarPagada(!sd.pagada);
  $('bExcel').onclick = () => descargarExcel(v);
  $('bReporte').onclick = () => abrirReporte();
  $('bReglas').onclick = () => modalReglas();
}

// ══════ AJUSTE MANUAL ══════
function semRef() { return db.collection('incentivos_semanas').doc(SEM); }
function camposSemana() { return { semana: fbSemanaISO(LUNES), anio: fbAnioSemanaISO(LUNES), lunes: DATOS.lunes, domingo: DATOS.domingo }; }
function modalAjuste(key, v) {
  const f = v.filas.find(x => x.key === key); if (!f) return;
  if (v.congelada) {
    openModal(`<h3>${esc(f.nombre)}</h3><div class="nota">Semana aprobada: ${f.sinDatos ? 'sin trabajos' : 'puntaje ' + esc(f.puntaje) + '%'} · ${esc(money(f.monto))}. Para cambiar el ajuste, reabre la semana.</div>
      ${f.ajuste ? `<div class="adj">✏️ Ajuste ${esc(signo(f.ajuste))} · "${esc(f.motivo)}"</div>` : ''}
      <div class="modal-actions"><button class="btn2 btn-sm" onclick="closeModal()">Cerrar</button></div>`);
    return;
  }
  openModal(`<h3>✏️ Ajuste — ${esc(f.nombre)}</h3>
    <div class="nota">Se suma (o resta, con signo −) al monto calculado: ${esc(money(f.montoCalc))}. El total nunca baja de RD$ 0.</div>
    <label class="f" for="aMonto">Ajuste (RD$)</label><input id="aMonto" type="number" inputmode="decimal" step="0.01" value="${f.ajuste || ''}" placeholder="Ej: 120 o -200"/>
    <label class="f" for="aMotivo">Motivo (obligatorio)</label><textarea id="aMotivo" maxlength="200" placeholder="Ej: Cubrió turno de noche el sábado">${esc(f.motivo)}</textarea>
    <div class="modal-actions">
      ${f.ajuste ? '<button class="btn2 btn-sm btn-danger" id="aQuitar">Quitar ajuste</button>' : ''}
      <button class="btn2 btn-sm" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-sm" id="aOk">Guardar</button>
    </div>`);
  const guardar = (monto, motivo) => {
    const FV = firebase.firestore.FieldValue;
    const aj = monto ? { monto, motivo, por: quien(), porUid: uidYo(), en: FV.serverTimestamp() } : FV.delete();
    // copia local enseguida (no se espera al servidor)
    DATOS.semDoc = DATOS.semDoc || { estado: 'borrador' };
    DATOS.semDoc.ajustes = { ...(DATOS.semDoc.ajustes || {}) };
    if (monto) DATOS.semDoc.ajustes[key] = { monto, motivo }; else delete DATOS.semDoc.ajustes[key];
    const datosDoc = { ...camposSemana(), ajustes: { [key]: aj } };
    if (!DATOS.semDoc.estado || DATOS.semDoc.estado !== 'aprobada') datosDoc.estado = DATOS.semDoc.estado || 'borrador';
    DATOS.semDoc.estado = datosDoc.estado;
    closeModal(); render();
    escribir(semRef().set(datosDoc, { merge: true }), monto ? `✏️ Ajuste guardado para ${f.nombre}` : `Ajuste quitado a ${f.nombre}`, () => cargarSemana(true));
  };
  $('aOk').onclick = () => {
    const raw = $('aMonto').value.trim();
    const monto = r2(raw === '' ? 0 : Number(raw));
    const motivo = $('aMotivo').value.trim().slice(0, 200);
    if (raw !== '' && !isFinite(Number(raw))) return toast('Escribe un monto válido', 'error');
    if (Math.abs(monto) > 1e7) return toast('El ajuste es demasiado grande', 'error');
    if (monto && !motivo) return toast('Escribe el motivo del ajuste', 'error');
    guardar(monto, motivo);
  };
  if ($('aQuitar')) $('aQuitar').onclick = () => guardar(0, '');
}

// ══════ APROBAR / REABRIR / PAGADA ══════
function modalAprobar(v, esActual) {
  const n = fbSemanaISO(LUNES);
  openModal(`<h3>✅ ¿Aprobar la semana ${n}?</h3>
    <div class="nota">${esc(rangoTxt(LUNES))} · ${v.filas.length} técnicos · total a pagar <b style="color:var(--text)">${esc(money(v.total))}</b>.</div>
    <div class="nota">Se guarda una copia de cada técnico (criterios, puntaje, base, ajuste y monto). Después ya no se recalcula aunque cambien las OTs o las reglas; para corregir hay que reabrirla.</div>
    ${esActual ? '<div class="formula" style="margin-top:10px">⚠️ Esta semana todavía no termina. Lo que pase de aquí al domingo no se contará.</div>' : ''}
    ${v.calidadDefinitiva > fbHoy() ? `<div class="formula" style="margin-top:10px">🛠 La calidad todavía no es definitiva (hasta el ${esc(ddmmaa(v.calidadDefinitiva))}).</div>` : ''}
    <div class="modal-actions"><button class="btn2 btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-sm" id="apOk">Sí, aprobar semana ${n}</button></div>`);
  $('apOk').onclick = () => {
    const tecnicos = v.filas.map(f => ({ key: f.key, nombre: f.nombre, criterios: f.criterios, puntaje: f.puntaje, sinDatos: f.sinDatos, cobra: f.cobra, base: f.base, pct: f.pct, salarioOk: f.salarioOk, montoCalc: f.montoCalc, ajuste: f.ajuste, motivo: f.motivo, monto: f.monto, bajo: f.bajo, info: f.info }));
    const sd = DATOS.semDoc || {};
    const doc = {
      ...camposSemana(), estado: 'aprobada', tecnicos,
      promedio: v.promedio, totalPagar: v.total, calidadDefinitiva: v.calidadDefinitiva,
      reglas: { pesos: CFG.pesos, minimo: CFG.minimo, metaParadaMin: CFG.metaParadaMin, metaFallaMin: CFG.metaFallaMin, diasReincidencia: CFG.diasReincidencia },
      aprobadoPor: quien(), aprobadoPorUid: uidYo(), aprobadoEn: fbTimestamp(),
      pagada: false, pagadoEn: null,
    };
    // merge: se conservan los ajustes (con quién y cuándo) y los datos de reapertura.
    DATOS.semDoc = { ...sd, ...doc, aprobadoEn: firebase.firestore.Timestamp.now() };
    closeModal(); render();
    escribir(semRef().set(doc, { merge: true }), `✅ Semana ${n} aprobada · ${money(v.total)}`, () => cargarSemana(true));
  };
}
function modalReabrir() {
  const n = fbSemanaISO(LUNES);
  openModal(`<h3>🔓 ¿Reabrir la semana ${n}?</h3>
    <div class="nota">La semana vuelve a borrador y se recalcula con los datos y reglas de hoy. Los ajustes se conservan. Queda registrado quién la reabrió.</div>
    <div class="modal-actions"><button class="btn2 btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-sm" id="reOk">Sí, reabrir</button></div>`);
  $('reOk').onclick = () => {
    const cambios = { estado: 'borrador', reabiertaPor: quien(), reabiertaPorUid: uidYo(), reabiertaEn: fbTimestamp() };
    closeModal();
    DATOS.semDoc = { ...(DATOS.semDoc || {}), ...cambios, reabiertaEn: firebase.firestore.Timestamp.now() };
    $('view').innerHTML = cabeceraHtml(null) + '<div class="card empty">Recalculando la semana...</div>'; bindCabecera();
    escribir(semRef().update(cambios), `🔓 Semana ${n} reabierta`, () => cargarSemana(true));
    // Una semana aprobada no tenía leídas sus OTs: se leen ahora.
    cargando = true;

}
function marcarPagada(si) {
  const cambios = si ? { pagada: true, pagadoEn: fbTimestamp(), pagadoPor: quien() } : { pagada: false, pagadoEn: null, pagadoPor: '' };
  DATOS.semDoc = { ...DATOS.semDoc, ...cambios, pagadoEn: si ? firebase.firestore.Timestamp.now() : null };
  render();
  escribir(semRef().update(cambios), si ? '💵 Semana marcada como pagada' : 'Se quitó la marca de pagada', () => cargarSemana(true));
}

// (25 oct 2026, Etapa 3) .xlsx de lo que se ve (nave y filtro de área / línea /

    ${campo('rPct', '% de incentivo por defecto', c.pctDefault, 'max="100" step="0.5"')}
    ${TECS.map((t, i) => { const ct = c.tecnicos[t.key] || {}; return `<div class="ts"><b style="font-size:14px;overflow-wrap:anywhere">${esc(t.nombre)}</b>
      <div class="g2">${campo('rs-' + i, 'Salario mensual RD$', ct.salario != null ? ct.salario : '', 'step="0.01"')}${campo('rq-' + i, '% incentivo', ct.pct != null ? ct.pct : '', 'max="100" step="0.5" placeholder="' + esc(c.pctDefault) + '"')}</div>

function resumenTrabajos(d) {

  d.otFecha.filter(o => sem(o.FECHA) && realizado(o)).sort((a, b) => String(a.id).localeCompare(String(b.id))).forEach(agrega);
  (d.otReal || []).filter(o => !anulada(o) && !hechas.has(o.id) && sem(tsFecha(o.trabajoRealizadoEn))).forEach(agrega);

    x.n++;

    eqs.set(k, x);

  eqs.forEach(x => { if (!x.area || !x.nombre) return; const ka = K(x.area); const a = porArea.get(ka) || { area: x.area, eqs: [], n: 0 }; a.eqs.push(x); a.n += x.n; porArea.set(ka, a); });
  const items = [], juntos = new Set();
  porArea.forEach(a => { if (a.eqs.length >= 3) { a.eqs.forEach(x => juntos.add(x)); items.push({ n: a.n, txt: `Mantenimiento de los equipos del área de ${a.area}.` }); } });
  eqs.forEach(x => {
    if (juntos.has(x)) return;

// Códigos, nombres y departamentos para que la próxima semana salgan ya puestos.
function cambiosCfgReporte() {
  const FV = firebase.firestore.FieldValue;
  const dep = String(REP.departamentoDefault || '').trim() || 'MANTENIMIENTO';
  const codigos = {}, nombres = {}, deps = {}, local = { codigos: { ...REPCFG.codigos }, nombres: { ...REPCFG.nombres }, departamentos: { ...REPCFG.departamentos } };
  let cambio = dep !== REPCFG.departamentoDefault;
  REP.filas.forEach(f => {
    if (!f.key) return;
    const c = String(f.codigo || '').trim();
    if (REPCFG.codigos[f.key] == null || String(REPCFG.codigos[f.key]) !== c) { codigos[f.key] = c; local.codigos[f.key] = c; cambio = true; }
    if (f.tipo === 'tec') {
      const n = String(f.nombre || '').trim(), quiere = n && n !== f.nombreDef ? n : null;
      if ((REPCFG.nombres[f.key] || null) !== quiere) { nombres[f.key] = quiere || FV.delete(); if (quiere) local.nombres[f.key] = quiere; else delete local.nombres[f.key]; cambio = true; }
    }
    const d = String(f.departamento || '').trim(), qd = d && d !== dep ? d : null;
    if ((REPCFG.departamentos[f.key] || null) !== qd) { deps[f.key] = qd || FV.delete(); if (qd) local.departamentos[f.key] = qd; else delete local.departamentos[f.key]; cambio = true; }
  });
  const extras = REP.filas.filter(f => f.tipo !== 'tec' && f.nombre).map(f => ({ tipo: f.tipo, key: f.key, nombre: String(f.nombre).trim(), codigo: String(f.codigo || '').trim(), departamento: String(f.departamento || '').trim(), nave: f.nave || '', monto: r2(f.monto), horas: r2(f.horas) }));
  // Los de otras naves se conservan si este reporte es de una sola nave.
  const act = fbNaveActiva();
  const extrasTodos = act ? REPCFG.extras.filter(x => x.nave && nk(x.nave) !== nk(act) && !extras.some(y => y.key === x.key)).concat(extras) : extras;
  if (JSON.stringify(extrasTodos) !== JSON.stringify(REPCFG.extras)) cambio = true;
  if (!cambio) return null;
  return { doc: { codigos, nombresReporte: nombres, departamentos: deps, departamentoDefault: dep, extrasReporte: extrasTodos, reporteActualizadoPor: quien(), reporteActualizadoEn: fbTimestamp() }, local: { ...local, departamentoDefault: dep, extras: extrasTodos } };
}
function guardarReporte(silencioso) {
  if (!REP) return;
  const rep = reporteParaGuardar();
  // Solo se agrega el campo `reporte`: los demás campos de la semana quedan igual.
  if (DATOS.semDoc) DATOS.semDoc.reporte = { ...rep, guardadoEn: firebase.firestore.Timestamp.now() };
  else DATOS.semDoc = { reporte: { ...rep, guardadoEn: firebase.firestore.Timestamp.now() } };

// ── Logo ──
const LOGO_MAX_W = 300, LOGO_MAX_B = 150 * 1024;
function cargarImagen(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo abrir la imagen')); };
    img.src = url;
  });
}
function reducirLogo(img) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  if (!iw || !ih) return null;
  let w = Math.min(LOGO_MAX_W, iw);
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  for (let n = 0; n < 6 && w >= 40; n++) {
    const h = Math.max(1, Math.round(w * ih / iw));
    c.width = w; c.height = h;
    ctx.clearRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    let data = c.toDataURL('image/png');
    if (data.length <= LOGO_MAX_B) return { data, tipo: 'png', ancho: w, alto: h };
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    for (const q of [0.92, 0.85, 0.75, 0.6]) { data = c.toDataURL('image/jpeg', q); if (data.length <= LOGO_MAX_B) return { data, tipo: 'jpeg', ancho: w, alto: h }; }
    w = Math.round(w * 0.75);
  }
  return null;
}
async function subirLogo(file) {
  if (!file) return;
  if (!/^image\/(png|jpeg|webp)$/.test(file.type || '')) return toast('Elige una imagen PNG o JPG', 'error');
  let r = null;
  try { r = reducirLogo(await cargarImagen(file)); } catch (e) { return toast('❌ ' + e.message, 'error'); }
  if (!r) return toast('La imagen es muy pesada aun reducida: prueba con otra más sencilla', 'error');
  LOGO = { ...r };
  const doc = { data: r.data, tipo: r.tipo, ancho: r.ancho, alto: r.alto, bytes: r.data.length, subidoPor: quien(), subidoPorUid: uidYo(), subidoEn: fbTimestamp() };
  if (REP) { pintarPapel(); pintarEditor(); }
  escribir(db.collection('incentivos_config').doc('logo').set(doc), '🖼 Logo guardado');
}

  Object.assign(ws.getCell('C' + r), { value: REP.firma, font: { bold: true }, alignment: { horizontal: 'center', vertical: 'top' }, border: { top: { style: 'thin' } } });
  ws.getCell('D' + r).border = { top: { style: 'thin' } };
  ws.pageSetup.printArea = 'A1:F' + r;
  return wb;
}
function csvReporte() {
  const filas = [];
  REP.grupos.forEach(g => {
    filasDe(g).forEach((f, n) => filas.push([n + 1, String(f.codigo || ''), f.nombre, f.departamento, r2(f.horas), r2(f.monto)]));
    filas.push(['', '', '', '', g.etiqueta, totalGrupo(g)]);
    filas.push(['', '', '', '', '', '']);
  });
  descLineas().forEach(l => filas.push(['', '', l, '', '', '']));
  filas.push(['', '', '', '', '', '']); filas.push(['', '', REP.firma, '', '', '']);
  return fbCsv([{ nombre: 'Incentivo', titulo: 'INCENTIVO · FECHAS: ' + ddmmaa(REP.fecha), columnas: COLS_REP.map(t => ({ t })), filas }]);
}
async function descargarReporteExcel() {
  if (!REP) return;
  autoguardar();
  const base = archivoRep();
  window.__incRep = { archivo: base + '.xlsx', formato: null };
  const b = $('repXls'); b.disabled = true;
  try {
    await fbCargarExcelJS();
    const wb = libroReporte();
    window.__incRep.wb = wb;
    const buf = await wb.xlsx.writeBuffer();
    fbDescargar(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), base + '.xlsx');
    window.__incRep.formato = 'xlsx';
    toast('⬇️ Excel descargado');
  } catch (e) {
    console.warn('Excel reporte:', e && e.message);
    window.__incRep.formato = 'csv-ofrecido';
    $('repCsvMsg').textContent = 'No se pudo preparar el Excel (' + ((e && e.message) || 'error') + '). Puedes descargar lo mismo en CSV, que también abre en Excel, o usar 🖨 PDF / Imprimir.';
    $('repCsvDlg').classList.add('open');
  } finally { b.disabled = false; }
}
function descargarReporteCsv() {
  $('repCsvDlg').classList.remove('open');
  const nombre = archivoRep() + '.csv';
  fbDescargar(new Blob([csvReporte()], { type: 'text/csv;charset=utf-8' }), nombre);
  window.__incRep = { ...(window.__incRep || {}), formato: 'csv', archivo: nombre };
  toast('⬇️ CSV descargado — ábrelo con Excel');
}
function imprimirReporte() {
  if (!REP) return;
  autoguardar();
  const p = $('repPaper'); p.style.transform = '';
  try { window.print(); } finally { setTimeout(ajustarPapel, 300); }
}
$('repCerrar').onclick = cerrarReporte;
$('repGuardar').onclick = () => guardarReporte(false);
$('repXls').onclick = descargarReporteExcel;
$('repPdf').onclick = imprimirReporte;
$('repCsvOk').onclick = descargarReporteCsv;
$('repCsvNo').onclick = () => $('repCsvDlg').classList.remove('open');
$('repEd').addEventListener('input', onRepInput);
$('repEd').addEventListener('change', onRepInput);
$('repEd').addEventListener('click', onRepClick);
$('repPaper').addEventListener('click', e => { const tr = e.target.closest('tr[data-rid]'); if (!tr) return; const c = $('repEd').querySelector(`.rf[data-rid="${tr.dataset.rid}"]`); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); const i = c.querySelector('input'); if (i) i.focus({ preventScroll: true }); } });
window.addEventListener('beforeprint', () => { const p = $('repPaper'); if (p) p.style.transform = ''; });
window.addEventListener('afterprint', () => { if (REP) ajustarPapel(); });
</script>
