<!DOCTYPE html>
<html lang="es">
<head>

<!-- (v3, nov 2026) Pantalla Hoy: estructura VoidTech, iconos, idiomas y traductor a pedido -->
<script src="icons.js"></script>
<script src="i18n.js"></script>
<script src="i18n/common.js"></script>
<script src="i18n/shell.js"></script>
<script src="i18n/hoy.js"></script>
<script src="traductor.js"></script>

<script src="hoy.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tema.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);min-height:100vh;}
  .wrap{max-width:720px;margin:0 auto;padding:16px 16px 32px;}
  /* Hoy */
  .hoy-hi{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:6px 0 14px;}
  .hoy-hi h1{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.02em;line-height:1.15;}
  .hoy-hi p{font-size:14px;color:var(--color-muted);margin-top:4px;}
  .hoy-hi p::first-letter{text-transform:uppercase;}
  .hoy-off{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:10px 12px;border-radius:var(--radius);background:var(--color-warn-soft);color:var(--color-warn-text);font-size:13.5px;font-weight:500;}
  .hoy-cards{display:grid;grid-template-columns:1fr;gap:12px;}
  @media (min-width:1024px){ .wrap{max-width:1100px;padding:24px 28px 40px;} .hoy-cards{grid-template-columns:1fr 1fr;align-items:start;} }
  .hoy-card{position:relative;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:14px 14px 6px;box-shadow:var(--shadow-1);overflow:hidden;min-width:0;}
  .hoy-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent;}
  .hoy-card.danger::before{background:var(--color-danger);}
  .hoy-card.warn::before{background:var(--color-warn);}
  .hoy-card.info::before{background:var(--color-info);}
  .hoy-card header{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .hoy-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--color-surface-2);color:var(--color-text);flex:0 0 auto;}
  .hoy-card.danger .hoy-ic{background:var(--color-danger-soft);color:var(--color-danger-text);}
  .hoy-card.warn .hoy-ic{background:var(--color-warn-soft);color:var(--color-warn-text);}
  .hoy-card.info .hoy-ic{background:var(--color-info-soft);color:var(--color-info-text);}
  .hoy-ic .vt-ico{width:19px;height:19px;}
  .hoy-card h2{flex:1;font-size:16px;font-weight:600;letter-spacing:-.005em;min-width:0;}
  .hoy-n{min-width:28px;height:26px;padding:0 9px;border-radius:13px;background:var(--color-surface-2);color:var(--color-text);font:700 14px var(--font-sans);line-height:26px;text-align:center;font-variant-numeric:tabular-nums;}
  .hoy-card.danger .hoy-n{background:var(--color-danger);color:#fff;}
  .hoy-it{display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 2px;border-top:1px solid var(--color-border);color:var(--color-text);text-decoration:none;}
  .hoy-card header + .hoy-it{border-top:0;}
  .hoy-it > .vt-ico{color:var(--color-muted);flex:0 0 auto;}
  .hoy-it-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .hoy-it-t{font-size:15px;font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:6px;overflow-wrap:anywhere;}
  .hoy-it small{font-size:12.5px;color:var(--color-muted);overflow-wrap:anywhere;}
  .hoy-it-d{font-size:13.5px;color:var(--color-text-2);line-height:1.4;overflow-wrap:anywhere;}
  .hoy-mas{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-height:44px;border-top:1px solid var(--color-border);color:var(--color-text);font-size:13.5px;font-weight:600;text-decoration:none;}
  .hoy-p{font-size:14px;color:var(--color-text-2);line-height:1.5;margin:2px 0 10px;}
  .hoy-p.sm{font-size:12.5px;color:var(--color-muted);}
  .hoy-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .hoy-card > .vt-btn{margin-bottom:10px;}
  .hoy-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin:4px 0 8px;}
  .hoy-kpi{padding:10px;border-radius:var(--radius);background:var(--color-surface-2);}
  .hoy-kpi b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .hoy-kpi small{display:block;font-size:12px;color:var(--color-muted);margin-top:2px;}
  .hoy-ok{text-align:center;padding:36px 18px;margin-bottom:12px;border:1px dashed var(--color-border-strong);border-radius:var(--radius-lg);background:var(--color-surface);}
  .hoy-ok .vt-ico{color:var(--color-success);}
  .hoy-ok h2{font-size:19px;margin-top:10px;}
  .hoy-ok p{font-size:14px;color:var(--color-muted);margin-top:4px;}
  .hoy-ts{text-align:center;font-size:12.5px;color:var(--color-muted);margin-top:18px;}
  .hoy-ts a{color:inherit;font-weight:600;}
  .hoy-sk{height:120px;border-radius:var(--radius-lg);background:linear-gradient(90deg,var(--color-surface) 0%,var(--color-surface-2) 50%,var(--color-surface) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite;margin-bottom:12px;border:1px solid var(--color-border);}
  @keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.hoy-sk{animation:none}}
  /* Todas las pantallas (v3 etapa 3a): los mismos grupos del menú Más (una sola lista: app-shell.js) */
  #todo h1{font-size:var(--fs-xl);font-weight:700;margin:6px 0 12px;}
  #todo .vt-grp{margin-bottom:6px;}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<main class="wrap">
  <div id="hoy" aria-live="polite"></div>
  <section id="todo" hidden>
    <h1 data-i18n="shell.p_todo">Todas las pantallas</h1>
    <div class="vt-todo" id="tiles"></div>
  </section>
</main>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
// (v3) Hoy es la pantalla de inicio. "Todas las pantallas" = index.html#todo: los mismos grupos del menú Más
// (VTShell.htmlGrupos; la lista de pantallas vive SOLO en app-shell.js).
function pintarTodo() {
  const todo = location.hash === '#todo';
  document.getElementById('todo').hidden = !todo;
  document.getElementById('hoy').hidden = todo;
  if (!todo || !window.VTShell || !window.currentUserRole) return;
  document.getElementById('tiles').innerHTML = VTShell.htmlGrupos('todo', 't');
}
window.addEventListener('hashchange', () => { pintarTodo(); if (location.hash !== '#todo' && window.VTHoy && window.currentUserRole) VTHoy.mostrar(false); });
window.addEventListener('idioma-cambiado', pintarTodo);
window.fbReady.then(() => {
  // Producción (rol Operador) solo puede reportar paradas: va directo ahí.
  if (window.currentUserRole && window.currentUserRole.rol === 'OPERADOR') { location.replace('reportar.html'); return; }
  fbOnNaveCambio(() => VTHoy.mostrar(true)); // la nave de arriba cambia lo que se ve, sin recargar
  const empezar = () => { pintarTodo(); if (location.hash !== '#todo') VTHoy.mostrar(false); };
  if (window.VTShell) empezar(); else { let n = 0; const t = setInterval(() => { if (window.VTShell || ++n > 40) { clearInterval(t); empezar(); } }, 50); }
}).catch(() => {});
</script>
</body>
</html>
