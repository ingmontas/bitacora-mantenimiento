<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0F1923"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>Iniciar sesión — Mantenimiento</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{--bg:#0F1923;--card:#202F42;--accent:#F59E0B;--text:#F1F5F9;--muted:#94A3B8;--border:#2D3F55;--red:#EF4444;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:30px 24px;max-width:360px;width:100%;}
  .emoji{font-size:34px;margin-bottom:10px;text-align:center;}
  h1{font-size:19px;margin-bottom:6px;text-align:center;}
  p.sub{font-size:12.5px;color:var(--muted);margin-bottom:22px;text-align:center;line-height:1.5;}
  label{font-size:10.5px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px;margin-top:14px;}
  input{width:100%;background:#1A2535;border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-size:14px;font-family:inherit;}
  input:focus{outline:1px solid var(--accent);}
  button{width:100%;margin-top:22px;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#1a1305;font-weight:700;font-size:15px;cursor:pointer;}
  button:disabled{opacity:.6;}
  #msg{margin-top:14px;font-size:13px;color:var(--red);min-height:18px;line-height:1.4;}
</style>
</head>
<body>
<div class="card">
  <div class="emoji">🔧</div>
  <h1>Mantenimiento</h1>
  <p class="sub">Inicia sesión con la cuenta que te asignó tu administrador.</p>
  <form id="loginForm">
    <label>Correo</label>
    <input type="email" id="email" required autocomplete="username" inputmode="email"/>
    <label>Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password"/>
    <div id="msg"></div>
    <button type="submit" id="submitBtn">Iniciar sesión</button>
  </form>
</div>
<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const params = new URLSearchParams(location.search);
const next = params.get('next') || 'index.html';

// CORRECCIÓN (revisión previa a publicar): si el navegador todavía tiene
// una sesión anónima vieja (de antes de esta fase), Firebase la reporta
// aquí como "user" — no es null, solo user.isAnonymous === true. Sin el
// "&& !user.isAnonymous" de abajo, esta pantalla te mandaba de vuelta a
// `next` sin haber pedido correo ni contraseña, saltándose el login por
// completo. No hace falta cerrar esa sesión anónima a mano aquí: en
// cuanto se firme con signInWithEmailAndPassword, Firebase la reemplaza
// por la sesión real.
auth.onAuthStateChanged((user) => { if (user && !user.isAnonymous) location.href = next; });

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    await auth.signInWithEmailAndPassword(
      document.getElementById('email').value.trim(),
      document.getElementById('password').value
    );
    // La redirección la hace onAuthStateChanged arriba.
  } catch (err) {
    const map = {
      'auth/invalid-email': 'Correo inválido.',
      'auth/user-disabled': 'Esta cuenta está deshabilitada.',
      'auth/user-not-found': 'No existe una cuenta con ese correo.',
      'auth/wrong-password': 'Contraseña incorrecta.',
      'auth/invalid-credential': 'Correo o contraseña incorrectos.',
      'auth/too-many-requests': 'Demasiados intentos — espera unos minutos e intenta de nuevo.',
    };
    msg.textContent = map[err.code] || ('Error: ' + err.message);
    btn.disabled = false; btn.textContent = 'Iniciar sesión';
  }
});
</script>
</body>
</html>
