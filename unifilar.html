/* ══════════════════════════════════════════════════════════════════════
   DIAGRAMA UNIFILAR — cómo llega la energía a cada máquina.
   (6 nov 2026) Módulo inicial · (9 nov 2026) Entrega 1 "Unifilar Pro":
   varios planos por planta (/diagramas), datos eléctricos completos por
   elemento (campo e), símbolos ANSI/IEEE 315 y plano impreso profesional
   (marco con zonas, simbología, notas, resumen, revisiones, cajetín y
   espacio para sello y firma del ingeniero) en 11×17, carta o A3.
   Datos: /electrico (un documento por elemento, padreId + diagramaId) y
   /diagramas (datos del plano). Lo leen Administrador, Encargado,
   Supervisor y Técnico (LOTO); lo editan Administrador y Encargado.
   Lecturas al abrir: /electrico + /diagramas (sin oyentes en vivo).
   ══════════════════════════════════════════════════════════════════════ */
#uf [hidden], .uf-form [hidden], .uf-hoja [hidden] { display: none !important; }
body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); }

.uf-plano select { flex: 1 1 260px; min-height: 48px; padding: 0 12px; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-input-bg, var(--color-surface)); color: var(--color-text); font: 600 15px var(--font-sans); }

.uf-est { display: inline-flex; align-items: center; min-height: 24px; padding: 0 9px; border-radius: var(--radius-pill); font: 600 12px var(--font-sans); border: 1px solid var(--color-border); background: var(--color-surface-2); color: var(--color-text); }

.uf-est.en_revision { background: var(--color-warn-soft); color: var(--color-warn-text); border-color: var(--color-warn); }
.uf-busca { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-input-bg, var(--color-surface)); margin-bottom: 10px; }

.uf-res { display: none; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); margin: -4px 0 10px; max-height: 260px; overflow: auto; }

.uf-res button { display: block; width: 100%; text-align: left; min-height: 48px; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--color-border); background: transparent; color: inherit; font: 14.5px var(--font-sans); cursor: pointer; }
.uf-res button small { display: block; color: var(--color-muted); font-size: 12.5px; }

.uf-main { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 1024px) { .uf-main { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } .uf-panel { position: sticky; top: calc(var(--hdr-h, 60px) + 12px); } }

.uf-form label { display: block; font-size: 13px; font-weight: 600; color: var(--color-muted); margin: 10px 0 4px; }
.uf-form input, .uf-form select, .uf-form textarea { width: 100%; min-height: 48px; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-input-bg, var(--color-surface)); color: var(--color-text); font: 15px var(--font-sans); box-sizing: border-box; }

.uf-revs th { text-align: left; font-size: 12px; color: var(--color-muted); border-bottom: 1px solid var(--color-border); padding: 6px 4px; }

/* ══════ Validación ══════ */

/* ══════ Plano impreso (solo al imprimir) ══════ */

<script>
'use strict';
// ── Ayudas ──
const $ = id => document.getElementById(id);
const esc = s => (typeof fbEsc === 'function' ? fbEsc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])));
const ic = (n, c) => (window.VTIcons ? VTIcons.icon(n, { cls: c || '' }) : '');
const tx = s => (window.i18n && i18n.tx ? i18n.tx(s) : s);
const toast = (m, t) => (window.vtToast ? vtToast(m, t) : alert(m));
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const hoyTxt = () => { const d = new Date(); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

// ══════ Tipos de elemento y sus datos eléctricos (campo e) ══════
const TIPOS = ['acometida', 'medidor', 'fusible', 'generador', 'transformador', 'transferencia', 'tablero', 'ccm', 'interruptor', 'vfd', 'capacitor', 'ups', 'spd', 'carga'];
const TIPO_TXT = { acometida: 'Acometida', medidor: 'Medición', fusible: 'Fusible', generador: 'Planta de emergencia', transformador: 'Transformador', transferencia: 'Transferencia', tablero: 'Tablero', ccm: 'Centro de control de motores', interruptor: 'Interruptor', vfd: 'Variador de frecuencia', capacitor: 'Banco de capacitores', ups: 'UPS', spd: 'Supresor de picos', carga: 'Carga' };
const CARGA_TXT = { motor: 'Motor', iluminacion: 'Iluminación', tomas: 'Tomacorrientes', otro: 'Otra carga' };
// [clave, etiqueta, ejemplo]

  ERROR = ''; SEL = null;

    const [s, sd] = await Promise.all([db.collection('electrico').get(), db.collection('diagramas').get().catch(e => { if (e && e.code === 'permission-denied') return { docs: [] }; throw e; })]);
    TODOS = new Map(); DIAGS = new Map();
    sd.docs.forEach(d => { const x = Object.assign({ id: d.id }, d.data()); if (fbEnNave(x)) DIAGS.set(d.id, x); });
    s.docs.forEach(d => { const x = Object.assign({ id: d.id }, d.data()); if (fbEnNave(x)) TODOS.set(d.id, x); });

async function quitar(n, fuera, cambiados, movidos) {

    (movidos || []).forEach(x => { NODOS.set(x.id, x); TODOS.set(x.id, x); });

function hoja(titulo, sub, cuerpo) {
  const bg = document.createElement('div'); bg.className = 'fbsh-bg';
  bg.innerHTML = `<div class="fbsh uf-form" role="dialog" aria-modal="true" aria-labelledby="ufHt"><div class="fbsh-head"><div><h3 id="ufHt">${esc(titulo)}</h3>${sub ? `<small>${esc(sub)}</small>` : ''}</div><button type="button" class="fbsh-x" data-x aria-label="${esc(tx('Cerrar'))}">✕</button></div>${cuerpo}</div>`;
  document.body.appendChild(bg);
  const previo = document.activeElement;
  const onKey = ev => { if (ev.key === 'Escape') cerrar(); };
  const cerrar = () => { document.removeEventListener('keydown', onKey); bg.remove(); try { if (previo && previo.focus) previo.focus(); } catch (e) {} };
  document.addEventListener('keydown', onKey);
  bg.querySelectorAll('[data-x]').forEach(b => b.onclick = cerrar);
  bg.addEventListener('click', ev => { if (ev.target === bg) cerrar(); });
  setTimeout(() => { const f = bg.querySelector('input, select, textarea'); if (f && !bg.contains(document.activeElement)) f.focus(); }, 30);
  return { bg, q: s => bg.querySelector(s), cerrar };
}

      if (o.asignarHuerfanos) {
        const hs = huerfanos(); hs.forEach(x => { x.diagramaId = pid; });
        const b = db.batch(); hs.forEach(x => b.set(db.collection('electrico').doc(x.id), datosParaGuardar(x))); if (hs.length) await b.commit();
      }
      H.cerrar(); toast(tx('Guardado'), 'ok');
      abrirPlano(pid);
      if (o.luegoAcometida) abrirForm(null, '', 'acometida');
    } catch (err) { q('#pOk').disabled = false; toast(tx('No se pudo guardar: {e}').replace('{e}', err.message), 'error'); }
  };
}

// ══════ Revisiones ══════
function abrirRevisiones() {
  const p = planoActual(); if (!p) return;
  const revs = (p.revisiones || []).slice().sort((a, b) => (Number(b.rev) || 0) - (Number(a.rev) || 0));
  const puede = PUEDE_EDITAR && !EJEMPLO;
  const H = hoja(tx('Revisiones'), (p.codigo ? p.codigo + ' · ' : '') + p.nombre, `
    <table class="uf-revs"><tr><th>${esc(tx('Rev.'))}</th><th>${esc(tx('Fecha'))}</th><th>${esc(tx('Descripción'))}</th><th>${esc(tx('Por'))}</th></tr>
    ${revs.map(r => `<tr><td>${esc(r.rev)}</td><td>${esc(r.fecha)}</td><td>${esc(r.desc)}</td><td>${esc(r.por)}</td></tr>`).join('') || `<tr><td colspan="4">—</td></tr>`}</table>
    ${puede ? `<h4>${esc(tx('Nueva revisión'))} (Rev. ${(Number(p.rev) || 0) + 1})</h4><label for="rDesc">${esc(tx('Qué cambió'))}</label><input id="rDesc" maxlength="200" placeholder="${esc(tx('Ej: Se agrega banco de capacitores BC-1'))}"/>
    <div class="uf-acts"><button type="button" class="vt-btn" data-x>${esc(tx('Cerrar'))}</button><button type="button" class="vt-btn pri" id="rOk">${ic('check')}${esc(tx('Guardar revisión'))}</button></div>` : `<div class="uf-acts"><button type="button" class="vt-btn" data-x>${esc(tx('Cerrar'))}</button></div>`}`);
  if (!puede) return;
  H.q('#rOk').onclick = async () => {
    const desc = H.q('#rDesc').value.trim();
    if (!desc) { toast(tx('Escribe qué cambió.'), 'warn'); return; }
    const nuevo = Object.assign({}, p, { rev: (Number(p.rev) || 0) + 1 });
    nuevo.revisiones = (p.revisiones || []).concat([{ rev: nuevo.rev, fecha: hoyTxt(), desc, por: yo() }]);
    H.q('#rOk').disabled = true;
    try { await db.collection('diagramas').doc(p.id).set(datosPlanoParaGuardar(nuevo)); DIAGS.set(p.id, nuevo); H.cerrar(); pintarBarraPlano(); toast(tx('Guardado'), 'ok'); }
    catch (err) { H.q('#rOk').disabled = false; toast(tx('No se pudo guardar: {e}').replace('{e}', err.message), 'error'); }
  };
}

// ══════ Plano impreso ══════
function resumenPlano() {
  let hp = 0, kw = 0, motores = 0, otras = 0; const tx_ = [], gens = [];
  NODOS.forEach(n => {
    const e = n.e || {}, num = v => parseFloat(String(v || '').replace(',', '.')) || 0;
    if (n.tipo === 'carga') { if (num(e.hp)) { hp += num(e.hp); motores++; } else { kw += num(e.kw); otras++; } }
    if (n.tipo === 'transformador' && num(e.kva)) tx_.push(n.nombre + ' ' + num(e.kva) + ' kVA');
    if (n.tipo === 'generador' && (num(e.kw) || num(e.kva))) gens.push(n.nombre + ' ' + (num(e.kw) ? num(e.kw) + ' kW' : num(e.kva) + ' kVA'));
  });
  const cuenta = t => Array.from(NODOS.values()).filter(n => (Array.isArray(t) ? t.includes(n.tipo) : n.tipo === t)).length;
  return [
    [tx('Tableros y CCM'), cuenta(['tablero', 'ccm'])], [tx('Interruptores'), cuenta('interruptor')],
    [tx('Motores'), motores + (hp ? ' · ' + Math.round(hp * 10) / 10 + ' HP' : '')], [tx('Otras cargas'), otras + (kw ? ' · ' + Math.round(kw * 10) / 10 + ' kW' : '')],
    [tx('Transformadores'), tx_.join(', ') || '—'], [tx('Respaldo'), gens.join(', ') || '—'],
  ];
}
function cajetinHtml(p, c, hojaTxt, tituloHoja) {
  const v = (x, ph) => esc(x || ph || '');
  const revs = (p.revisiones || []).slice().sort((a, b) => (Number(b.rev) || 0) - (Number(a.rev) || 0)).slice(0, 4);
  return `<div class="h-caj">
      <div><div class="h-t">${esc(tx('REVISIONES'))}</div><table class="h-revs"><tr><th>${esc(tx('Rev.'))}</th><th>${esc(tx('Fecha'))}</th><th>${esc(tx('Descripción'))}</th><th>${esc(tx('Por'))}</th></tr>${revs.map(r => `<tr><td>${esc(r.rev)}</td><td>${esc(r.fecha)}</td><td>${esc(corta(r.desc, 46))}</td><td>${esc(corta(r.por, 14))}</td></tr>`).join('')}</table></div>
      <div><div class="h-logo"><i>VT</i><b style="font-size:9.5pt">${v(c.empresa)}</b></div><div>${v(c.direccion)}</div><div>${v(p.planta)}</div></div>
      <div><div class="h-lb">${esc(tx('PROYECTO'))}</div><div style="font-weight:600;font-size:9pt">${v(c.proyecto)}</div><div class="h-lb" style="margin-top:4px">${esc(tx('TÍTULO DEL PLANO'))}</div><div style="font-weight:700;font-size:11pt">${esc(tituloHoja)}</div><div style="margin-top:3px;font-weight:600">${esc(tx('Estado'))}: ${esc(tx(ESTADO_TXT[p.estado] || ''))}</div></div>
      <div class="h-datos">
        <div><div class="h-lb">${esc(tx('PLANO N.º'))}</div><div class="h-v">${v(p.codigo)}</div></div><div><div class="h-lb">${esc(tx('REV.'))}</div><div class="h-v">${esc(p.rev || 0)}</div></div>
        <div><div class="h-lb">${esc(tx('HOJA'))}</div><div class="h-v">${esc(hojaTxt)}</div></div><div><div class="h-lb">${esc(tx('FECHA'))}</div><div class="h-v" style="font-size:8.5pt">${esc(hoyTxt())}</div></div>
        <div><div class="h-lb">${esc(tx('DIBUJÓ'))}</div><div>${v(c.dibujo, '—')}</div></div><div><div class="h-lb">${esc(tx('REVISÓ'))}</div><div>${v(c.reviso, '—')}</div></div>
      </div>
      <div class="h-sello"><div class="h-t">${esc(tx('INGENIERO RESPONSABLE'))}</div><div class="s">${esc(tx('Sello y firma'))}</div><div>${v(c.ingNombre, '[ ]')}</div><div>CODIA N.º ${v(c.ingCodia, '[ ]')}</div></div>
    </div>`;
}
const zonasHtml = () => Array.from({ length: 8 }, (_, i) => `<span class="zn" style="top:1px;left:${(i + 0.5) * 12.5}%">${i + 1}</span>`).join('') + ['A', 'B', 'C', 'D'].map((l, i) => `<span class="zn" style="left:2px;top:${(i + 0.5) * 25}%">${l}</span>`).join('');
function hoja2Html(p, c, tam, tituloHoja) {
  const v = x => esc(x || '');
  // Cuadros de carga: un cuadro por tablero / CCM con sus circuitos (lo que cuelga directo de él)
  calcularPosiciones();
  const barras = Array.from(NODOS.values()).filter(n => ES_BARRA(n.tipo)).sort((a, b) => ((POS.get(a.id) || {}).d - (POS.get(b.id) || {}).d) || ((POS.get(a.id) || {}).x - (POS.get(b.id) || {}).x));
  const cuadros = barras.map(b => {
    const rb = res(b.id) || {}, cs = hijos(b.id);
    const filas = cs.map((h, i) => {
      const rh = res(h.id) || {}, abajo = hijos(h.id), destino = abajo.length === 1 ? abajo[0].nombre : abajo.length ? abajo.length + ' ' + tx('circuitos') : '—';
      return `<tr><td>${i + 1}</td><td>${esc(corta(h.nombre, 18))}</td><td>${esc(corta(destino, 22))}</td><td>${esc(corta(lineas(h).a, 22))}</td><td>${esc(corta(h.calibre || '—', 20))}</td><td class="n">${rh.kva ? fmt1(rh.kva) : '—'}</td><td class="n">${rh.i ? fmt1(rh.i) : '—'}</td></tr>`;
    }).join('');
    return `<h5>${esc(b.nombre)} · ${esc(lineas(b).a)}</h5><table class="h-t2"><tr><th>${esc(tx('Cto.'))}</th><th>${esc(tx('Protección'))}</th><th>${esc(tx('Alimenta'))}</th><th>${esc(tx('Capacidad'))}</th><th>${esc(tx('Conductor'))}</th><th class="n">kVA</th><th class="n">A</th></tr>${filas}<tr class="tot"><td></td><td colspan="4">${esc(tx('TOTAL'))} ${rb.uso != null && rb.kva ? '· ' + esc(tx('Uso de la barra')) + ' ' + Math.round(rb.uso) + ' %' : ''}</td><td class="n">${rb.kva ? fmt1(rb.kva) : '—'}</td><td class="n">${rb.i ? fmt1(rb.i) : '—'}</td></tr></table>`;
  }).join('') || `<div>${esc(tx('Sin tableros en este plano.'))}</div>`;
  // Estudio: cada punto con capacidad de cortocircuito o caída de tensión
  const puntos = Array.from(NODOS.values()).filter(n => ['transformador', 'tablero', 'ccm', 'interruptor', 'transferencia'].includes(n.tipo) || (res(n.id) && res(n.id).vd));
  const filasE = puntos.map(n => {
    const r = res(n.id) || {}, e = n.e || {}, padre = NODOS.get(n.padreId);
    const disp = n.tipo === 'interruptor' && padre ? (res(padre.id) || {}).isc : r.isc;
    const mal = r.problemas && r.problemas.some(q => q.nivel === 'error');
    const resu = mal ? tx('NO CUMPLE') : r.problemas && r.problemas.length ? tx('Revisar') : tx('Cumple');
    return `<tr class="${mal ? 'mal' : ''}"><td>${esc(corta(n.nombre, 20))}</td><td class="n">${kA(disp)}</td><td class="n">${e.kaic ? esc(e.kaic) + ' kA' : '—'}</td><td class="n">${r.vd ? fmt1(r.vd) + ' %' : '—'}</td><td class="n">${r.vdTot ? fmt1(r.vdTot) + ' %' : '—'}</td><td class="n">${r.uso != null && r.kva ? Math.round(r.uso) + ' %' : '—'}</td><td>${esc(resu)}</td></tr>`;
  }).join('');
  const probs = (CALC ? CALC.problemas : []).slice(0, 14).map(q => `<div>${esc(q.nivel === 'error' ? tx('ERROR') : tx('AVISO'))} · <b>${esc(q.nombre)}</b>: ${esc(textoProb(q))}</div>`).join('') || `<div>${esc(tx('Sin errores ni avisos con los datos cargados.'))}</div>`;
  return `<div class="uf-hoja ${tam}" style="--col: 46%">${zonasHtml()}
    <div class="h-cab"><b>${esc(tx('CUADROS DE CARGA Y ESTUDIO ELÉCTRICO'))}</b><span>${v(p.sistema)}</span><span class="h-est">${esc(tx(ESTADO_TXT[p.estado] || '').toUpperCase())}</span></div>
    <div class="h-cc">${cuadros}</div>
    <div class="h-col">
      <div class="h-box"><div class="h-t">${esc(tx('ESTUDIO DE CORTOCIRCUITO Y CAÍDA DE TENSIÓN'))}</div><table class="h-t2"><tr><th>${esc(tx('Punto'))}</th><th class="n">${esc(tx('Icc disponible'))}</th><th class="n">${esc(tx('Capacidad'))}</th><th class="n">${esc(tx('Caída tramo'))}</th><th class="n">${esc(tx('Caída total'))}</th><th class="n">${esc(tx('Uso'))}</th><th>${esc(tx('Resultado'))}</th></tr>${filasE}</table></div>
      <div class="h-box"><div class="h-t">${esc(tx('VALIDACIÓN'))}</div>${probs}</div>
      <div class="h-box"><div class="h-t">${esc(tx('MÉTODO'))}</div><div>${esc(tx('Cortocircuito por el método punto a punto, con barra infinita en el primario y aporte de motores (4 × corriente nominal). Corriente de motores según NEC tabla 430.250. Caída de tensión con conductores de cobre (K = 12.9). Cálculo aproximado: debe revisarlo y firmarlo el ingeniero responsable.'))}</div></div>
    </div>
    ${cajetinHtml(p, c, '2 / 2', tituloHoja === (c.titulo || p.nombre) ? tx('Cuadros de carga y estudio') : tituloHoja)}
  </div>`;
}
function armarHoja() {
  recalcular();
  const p = planoActual() || { nombre: tx('Diagrama unifilar'), codigo: '', planta: fbNaveActiva() || '', estado: 'borrador', rev: 0, revisiones: [], cajetin: {}, notas: NOTAS_DEF, tamano: 'tabloide', sistema: '' };
  const c = p.cajetin || {};
  const tam = TAMANOS[p.tamano] ? p.tamano : 'tabloide';
  $('ufPage').textContent = '@page { size: ' + TAMANOS[tam][1] + '; margin: 0; }';
  const s = svgPlano({ vivo: false });
  const v = (x, ph) => esc(x || ph || '');
  const titulo = c.titulo || p.nombre;
  const totKva = raices().reduce((a, n) => a + ((res(n.id) || {}).kva || 0), 0);
  const resumen = resumenPlano().concat(totKva ? [[tx('Carga conectada'), fmt1(totKva) + ' kVA']] : []).concat(CALC ? [[tx('Validación'), CALC.errores ? CALC.errores + ' ' + tx(CALC.errores === 1 ? 'error' : 'errores') : tx('Cumple')]] : []);
  $('ufHojas').innerHTML = `<div class="uf-hoja ${tam}">${zonasHtml()}
    <div class="h-cab"><b>${v(titulo.toUpperCase())}</b><span>${v(p.sistema)} · ${esc(tx('Símbolos ANSI/IEEE 315'))} · ${v(c.escala, tx('Sin escala'))}</span><span class="h-est">${esc(tx(ESTADO_TXT[p.estado] || '').toUpperCase())}</span></div>
    <div class="h-dib"><svg class="uf-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s.W} ${s.H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(tx('Diagrama unifilar'))}">${s.html}</svg></div>
    <div class="h-col">
      <div class="h-box"><div class="h-t">${esc(tx('SIMBOLOGÍA (ANSI/IEEE 315)'))}</div><div class="h-ley">${LEY.map(([t, l]) => `<svg class="uf-svg" viewBox="0 0 50 50">${svgLeyenda(t)}</svg><span>${esc(tx(l))}</span>`).join('')}</div></div>
      <div class="h-box"><div class="h-t">${esc(tx('NOTAS GENERALES'))}</div><div class="h-notas">${esc(p.notas || '')}</div></div>
      <div class="h-box"><div class="h-t">${esc(tx('RESUMEN'))}</div><table class="h-res" style="width:100%;border-collapse:collapse">${resumen.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</table></div>
    </div>
    ${cajetinHtml(p, c, '1 / 2', titulo)}
  </div>` + hoja2Html(p, c, tam, titulo);
}
function imprimir() {
  if (!NODOS.size) { toast(tx('El plano está vacío.'), 'warn'); return; }
  armarHoja();
  setTimeout(() => window.print(), 50);
}

// ══════ Arranque ══════
$('ufBuscar').addEventListener('input', buscar);
$('ufBtnPrint').onclick = imprimir;
$('ufBtnRevs').onclick = abrirRevisiones;
$('ufBtnDatos').onclick = () => { if (DIAG) abrirFormPlano(DIAG); };
$('ufBtnPlano').onclick = () => abrirFormPlano(null);
$('ufPlanoSel').onchange = () => abrirPlano($('ufPlanoSel').value);
$('ufBtnNuevo').onclick = () => abrirForm(null, SEL && NODOS.get(SEL) && PUEDE_HIJOS(NODOS.get(SEL).tipo) ? SEL : '');
$('ufZmas').onclick = () => { ZOOM = Math.min(2.5, ZOOM * 1.25); dibujar(); };
$('ufZmenos').onclick = () => { ZOOM = Math.max(0.3, ZOOM / 1.25); dibujar(); };
$('ufZfit').onclick = ajustar;

window.fbReady.then(() => {
  PUEDE_EDITAR = userHasRole('ADMINISTRADOR', 'ENCARGADO_MANTENIMIENTO');
  if (typeof fbOnNaveCambio === 'function') fbOnNaveCambio(() => { if (!EJEMPLO) cargar(); });
  panel(); cargar();
}).catch(() => {});
